<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#0d0f18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MyPocket"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="/manifest.json"/>
<title>MyPocket</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f18;--surf:#141720;--card:#1a1e2e;--raised:#1f2438;
  --border:#262d42;--muted:#2e3650;--text:#e8ecf8;--sub:#5c6585;--dim:#3a4260;
  --green:#2ecc9a;--red:#f0546a;--blue:#4a90f5;--indigo:#7c6ef7;
  --amber:#f5a623;--sky:#38c8f5;--violet:#b06ef7;--rose:#fb7185;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

/* PIN SCREEN */
.pin-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.pin-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 8px 32px #4a90f540}
.pin-title{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px}
.pin-sub{font-size:13px;color:var(--sub);margin-bottom:32px;text-align:center}
.pin-dots{display:flex;gap:16px;margin-bottom:32px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue);transform:scale(1.1)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px}
.pin-key{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;font-size:22px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:all .15s;color:var(--text)}
.pin-key:active{background:var(--raised);transform:scale(.94)}
.pin-key.del{font-size:18px;color:var(--sub)}
.pin-key.empty{background:transparent;border-color:transparent;cursor:default}
.pin-err{color:var(--red);font-size:13px;font-weight:600;margin-top:12px;min-height:18px}

/* PAGE */
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(80px + var(--safe-bot));padding-top:calc(16px + var(--safe-top));-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}

/* TOPBAR */
.topbar{background:var(--surf);border-bottom:1px solid var(--border);padding:0 18px;height:calc(56px + var(--safe-top));padding-top:var(--safe-top);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;flex-shrink:0}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 14px #4a90f540}
.topbar-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.02em}
.topbar-sub{font-size:10px;color:var(--sub);margin-top:1px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.topbar-btn{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#4a90f5,#7c6ef7);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #4a90f540;transition:transform .15s;flex-shrink:0}
.topbar-btn:active{transform:scale(.92)}
.topbar-btn.ghost{background:var(--card);border:1px solid var(--border);font-size:16px;box-shadow:none;color:var(--sub)}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:var(--safe-bot)}
.nav-btn{flex:1;padding:10px 0 6px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;color:var(--dim);transition:color .15s}
.nav-btn.active{color:var(--blue)}
.nav-btn .icon{font-size:20px;line-height:1}
.nav-btn .label{font-size:10px;font-weight:700;letter-spacing:.04em}
.nav-btn .pip{width:18px;height:2px;border-radius:1px;background:var(--blue);margin-top:2px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px}
.sec-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:block}

/* INPUTS */
.input{width:100%;background:var(--raised);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px 14px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;appearance:none;-webkit-appearance:none}
.input:focus{border-color:var(--blue)}
.input::placeholder{color:var(--sub)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}

/* BUTTONS */
.btn-primary{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:'Sora',sans-serif;letter-spacing:.02em;box-shadow:0 4px 20px #4a90f530;transition:transform .15s,opacity .15s}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-primary.green{background:linear-gradient(135deg,#2ecc9a,#1aaa7e);box-shadow:0 4px 20px #2ecc9a30}
.btn-primary.red{background:linear-gradient(135deg,#f0546a,#d03050);box-shadow:0 4px 20px #f0546a30}
.btn-primary.amber{background:linear-gradient(135deg,#f5a623,#d4881a)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--sub);border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-back{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;padding:0;margin-bottom:18px;font-family:inherit;display:flex;align-items:center;gap:5px}

/* PILL TABS */
.pill-tabs{display:flex;background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.pill-tab{flex:1;padding:8px 0;border:none;cursor:pointer;background:transparent;color:var(--sub);font-weight:700;font-size:12px;font-family:inherit;transition:all .15s}
.pill-tab.active{background:var(--blue);color:#fff}

/* TYPE TOGGLE */
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.type-btn{padding:14px 0;border-radius:14px;border:1px solid var(--border);cursor:pointer;font-weight:800;font-size:18px;font-family:'Sora',sans-serif;transition:all .2s;background:var(--card);color:var(--sub)}
.type-btn span{display:block;font-size:11px;font-weight:700;margin-top:3px}
.type-btn.income.active{background:#2ecc9a22;color:var(--green);border-color:#2ecc9a55}
.type-btn.expense.active{background:#f0546a22;color:var(--red);border-color:#f0546a55}

/* CAT GRID */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cat-btn{padding:10px 4px;border-radius:12px;border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;background:var(--card);font-family:inherit}
.cat-btn .cat-icon{font-size:18px}
.cat-btn .cat-name{font-size:9px;font-weight:700;color:var(--sub);text-align:center;line-height:1.2}

/* TX ROW */
.tx-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #26334214}
.tx-row:last-child{border-bottom:none}
.tx-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-main{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--sub);margin-top:2px}
.tx-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-del{background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px;flex-shrink:0}

/* HERO */
.hero{background:linear-gradient(145deg,#162040,#0f1628);border:1px solid #2a4080aa;border-radius:22px;padding:24px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#4a90f518,transparent 70%);top:-60px;right:-40px;pointer-events:none}
.hero-label{font-size:11px;font-weight:700;color:#7090d0;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.hero-amount{font-family:'Sora',sans-serif;font-size:42px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-row{display:flex;justify-content:center;gap:32px;margin-top:18px}
.hero-stat-lbl{font-size:10px;font-weight:700;color:#7090d0;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.hero-stat-val{font-size:16px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}
.hero-divider{width:1px;background:#2a4080}

/* STAT ROW */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.stat-lbl{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-size:20px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}

/* ACC CARD */
.acc-card{border-radius:18px;padding:18px 20px;margin-bottom:12px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.acc-card:active{transform:scale(.98)}
.acc-card-name{font-size:16px;font-weight:800;font-family:'Sora',sans-serif;margin-bottom:4px}
.acc-card-bal{font-size:26px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}
.acc-card-sub{font-size:11px;opacity:.6;margin-top:6px}
.acc-card-glow{position:absolute;width:120px;height:120px;border-radius:50%;opacity:.15;top:-30px;right:-20px}

/* PROGRESS */
.progress-track{height:6px;background:var(--muted);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease}

/* AMOUNT HERO */
.amount-hero{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px;text-align:center}
.amount-hero .currency{font-size:26px;color:var(--sub);font-weight:700}
.amount-hero input{background:transparent;border:none;outline:none;font-size:42px;font-weight:800;font-family:'Sora',sans-serif;text-align:center;width:180px;font-variant-numeric:tabular-nums}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:#000a;z-index:300;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
.modal-sheet{background:var(--surf);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-bot));width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease}
.modal-handle{width:36px;height:4px;background:var(--muted);border-radius:2px;margin:0 auto 18px}

/* CHIP */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}

/* RING */
.ring-wrap{position:relative;display:inline-block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* SEARCHBAR */
.searchbar{position:relative;margin-bottom:12px}
.searchbar .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px;pointer-events:none}
.searchbar input{padding-left:34px}

/* DATE GROUP */
.date-hdr{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;margin-bottom:4px}
.date-hdr-left{font-size:11px;font-weight:700;color:var(--sub)}
.date-hdr-right{display:flex;gap:8px;font-size:11px;font-weight:700}

/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px 10px;border-radius:8px;font-family:inherit}
.cal-nav:active{background:var(--muted)}
.cal-month{font-family:'Sora',sans-serif;font-size:16px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-name{font-size:10px;font-weight:700;color:var(--sub);text-align:center;padding:4px 0}
.cal-day{min-height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 4px;cursor:pointer;transition:background .15s;position:relative}
.cal-day:active{background:var(--muted)}
.cal-day.today .cal-day-num{background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-day.selected{background:var(--raised);border:1px solid var(--blue)44}
.cal-day.other-month .cal-day-num{color:var(--dim)}
.cal-day-num{font-size:12px;font-weight:600;line-height:1;margin-bottom:3px}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal-dot{width:4px;height:4px;border-radius:50%}

/* RECEIPT */
.receipt-preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}
.receipt-placeholder{width:100%;height:100px;border-radius:12px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;margin-bottom:8px;color:var(--sub);font-size:13px;font-weight:600}

/* CURRENCY BADGE */
.cur-badge{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--sky)}

/* RECURRING BADGE */
.rec-badge{background:#7c6ef722;border:1px solid #7c6ef744;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--indigo)}

/* REMINDER */
.reminder-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)33}
.reminder-row:last-child{border-bottom:none}
.reminder-icon{width:38px;height:38px;border-radius:11px;background:var(--amber)22;border:1px solid var(--amber)44;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.reminder-main{flex:1;min-width:0}
.reminder-name{font-size:13px;font-weight:600}
.reminder-meta{font-size:11px;color:var(--sub);margin-top:2px}
.reminder-due{font-size:12px;font-weight:700;white-space:nowrap}

/* NET WORTH CHART SVG */
.nw-chart{width:100%;overflow:visible}

/* INSTALL BANNER */
.install-banner{background:linear-gradient(135deg,#1a2a50,#1a1e38);border:1px solid #2a4080aa;border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.ib-icon{font-size:24px;flex-shrink:0}
.ib-text{flex:1}
.ib-title{font-size:13px;font-weight:700;margin-bottom:2px}
.ib-sub{font-size:11px;color:var(--sub)}
.ib-btn{background:var(--blue);border:none;color:#fff;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}

/* EMPTY */
.empty{text-align:center;padding:48px 0;color:var(--sub)}
.empty .e-icon{font-size:40px;margin-bottom:12px}
.empty .e-text{font-size:14px}

/* MISC */
.err{color:var(--red);font-size:12px;margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:16px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}

input[type="date"]{color-scheme:dark}
select option{background:var(--card)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .25s ease forwards}
.shake{animation:shake .3s ease}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useMemo,useCallback,useRef} = React;
const h = React.createElement;

/* ── HELPERS ── */
const fmt=(n,cur='USD',dec=0)=>{
  if(isNaN(n))return'$0';
  try{return new Intl.NumberFormat('en-US',{style:'currency',currency:cur,maximumFractionDigits:dec}).format(n);}
  catch{return'$'+n.toFixed(dec);}
};
const fmtK=n=>Math.abs(n)>=1000?`${n<0?'-':''}$${(Math.abs(n)/1000).toFixed(1)}k`:fmt(n);
const today=()=>new Date().toISOString().split('T')[0];
const genId=()=>Math.random().toString(36).slice(2,10);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ── PERSIST ── */
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};
function usePersist(key,def){
  const[val,setVal]=useState(()=>LS.get(key,def));
  const set=useCallback(v=>{
    setVal(prev=>{const next=typeof v==='function'?v(prev):v;LS.set(key,next);return next;});
  },[key]);
  return[val,set];
}

/* ── CATEGORIES ── */
const CAT={
  'Salary':{icon:'💼',color:'#4a90f5'},'Freelance':{icon:'🖥️',color:'#7c6ef7'},
  'Investment':{icon:'📈',color:'#2ecc9a'},'Rental':{icon:'🏠',color:'#f5a623'},
  'Bonus':{icon:'🎁',color:'#f5a623'},'Business':{icon:'🏢',color:'#38c8f5'},
  'Other Income':{icon:'💰',color:'#2ecc9a'},'Food':{icon:'🍔',color:'#f5a623'},
  'Housing':{icon:'🏠',color:'#4a90f5'},'Transport':{icon:'🚗',color:'#f5a623'},
  'Health':{icon:'💊',color:'#ff7eb3'},'Entertainment':{icon:'🎬',color:'#7c6ef7'},
  'Shopping':{icon:'🛍️',color:'#f0546a'},'Utilities':{icon:'⚡',color:'#38c8f5'},
  'Education':{icon:'📚',color:'#4a90f5'},'Travel':{icon:'✈️',color:'#2ecc9a'},
  'Subscriptions':{icon:'📱',color:'#b06ef7'},'Savings':{icon:'🏦',color:'#2ecc9a'},
  'Other':{icon:'📦',color:'#3a4260'},
};
const INC_CATS=['Salary','Freelance','Investment','Rental','Bonus','Business','Other Income'];
const EXP_CATS=['Food','Housing','Transport','Health','Entertainment','Shopping','Utilities','Education','Travel','Subscriptions','Savings','Other'];
const catColor=c=>CAT[c]?.color||'#3a4260';
const catIcon=c=>CAT[c]?.icon||'📦';

/* ── CURRENCIES ── */
const CURRENCIES=['USD','EUR','GBP','AED','SAR','QAR','KWD','BHD','OMR','INR','JPY','CAD','AUD','CHF','SGD'];
const CUR_SYMBOLS={'USD':'$','EUR':'€','GBP':'£','AED':'د.إ','SAR':'﷼','QAR':'ر.ق','KWD':'د.ك','BHD':'BD','OMR':'ر.ع','INR':'₹','JPY':'¥','CAD':'C$','AUD':'A$','CHF':'Fr','SGD':'S$'};

/* ── ACCOUNT TYPES ── */
const ACC_TYPES={
  'Checking':{icon:'🏦',grad:['#1a3060','#0f1e44'],accent:'#4a90f5'},

/* ── PIN SCREEN ── */
function PinScreen({mode,savedPin,onUnlock,onSetPin}){
  const[input,setInput]=useState('');
  const[confirm,setConfirm]=useState('');
  const[step,setStep]=useState(mode==='set'?'enter':'verify'); // enter|confirm|verify
  const[err,setErr]=useState('');
  const[shake,setShake]=useState(false);

  const doShake=()=>{setShake(true);setTimeout(()=>setShake(false),400);};

  const press=key=>{
    if(key==='del'){
      if(step==='confirm')setConfirm(p=>p.slice(0,-1));
      else setInput(p=>p.slice(0,-1));
      return;
    }
    const newVal=(step==='confirm'?confirm:input)+key;
    if(step==='confirm') setConfirm(newVal);
    else setInput(newVal);

    if(newVal.length===4){
      if(step==='enter'&&mode==='set'){setStep('confirm');setErr('');}
      else if(step==='confirm'){
        if(newVal===input){onSetPin(input);onUnlock();}
        else{setErr('PINs do not match');setConfirm('');doShake();}
      }
      else if(step==='verify'){
        if(newVal===savedPin){onUnlock();}
        else{setErr('Incorrect PIN');setInput('');doShake();}
      }
    }
  };

  const current=step==='confirm'?confirm:input;
  const subtitle=mode==='set'?(step==='enter'?'Create a 4-digit PIN':'Confirm your PIN'):'Enter your PIN';

  return h('div',{className:'pin-screen'},
    h('div',{className:'pin-logo'},'👛'),
    h('div',{className:'pin-title'},'MyPocket'),
    h('div',{className:'pin-sub'},subtitle),
    h('div',{className:`pin-dots${shake?' shake':''}`,key:step},
      [0,1,2,3].map(i=>h('div',{key:i,className:`pin-dot${current.length>i?' filled':''}${err&&current.length===0?' error':''}`}))
    ),
    h('div',{className:'pin-pad'},
      ['1','2','3','4','5','6','7','8','9','','0','del'].map((k,i)=>
        k===''
          ? h('div',{key:i,className:'pin-key empty'})
          : h('button',{key:i,className:`pin-key${k==='del'?' del':''}`,onClick:()=>press(k)},
              k==='del'?'⌫':k
            )
      )
    ),
    h('div',{className:'pin-err'},err)
  );
}

/* ── CALENDAR TAB ── */
function CalendarTab({txs}){
  const now=new Date();
  const[year,setYear]=useState(now.getFullYear());
  const[month,setMonth]=useState(now.getMonth());
  const[selected,setSelected]=useState(today());

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=today();

  // Build tx map
  const txMap=useMemo(()=>{
    const m={};
    txs.forEach(tx=>{
      if(!m[tx.date])m[tx.date]=[];
      m[tx.date].push(tx);
    });
    return m;
  },[txs]);

  const prev=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const next=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};

  const selTxs=(txMap[selected]||[]).sort((a,b)=>a.type.localeCompare(b.type));
  const selInc=selTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const selExp=selTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);

  return h('div',null,
    h('div',{className:'card'},
      h('div',{className:'cal-header'},
        h('button',{className:'cal-nav',onClick:prev},'‹'),
        h('div',{className:'cal-month'},MONTHS[month]+' '+year),
        h('button',{className:'cal-nav',onClick:next},'›')
      ),
      h('div',{className:'cal-grid'},
        DAYS.map(d=>h('div',{key:d,className:'cal-day-name'},d)),
        cells.map((d,i)=>{
          if(!d)return h('div',{key:'e'+i});
          const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const dayTxs=txMap[dateStr]||[];
          const isToday=dateStr===todayStr;
          const isSel=dateStr===selected;
          return h('div',{key:d,className:`cal-day${isToday?' today':''}${isSel?' selected':''}`,onClick:()=>setSelected(dateStr)},
            h('div',{className:'cal-day-num'},d),
            dayTxs.length>0&&h('div',{className:'cal-dots'},
              dayTxs.slice(0,3).map((tx,j)=>
                h('div',{key:j,className:'cal-dot',style:{background:tx.type==='income'?'var(--green)':'var(--red)'}})
              )
            )
          );
        })
      )
    ),
    // Selected day detail
    h('div',{className:'card'},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
        h('div',{className:'card-title',style:{marginBottom:0}},new Date(selected+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})),
        selTxs.length>0&&h('div',{style:{display:'flex',gap:8}},
          selInc>0&&h('span',{style:{color:'var(--green)',fontWeight:700,fontSize:12}},'+'+fmt(selInc)),
          selExp>0&&h('span',{style:{color:'var(--red)',fontWeight:700,fontSize:12}},'−'+fmt(selExp))
        )
      ),
      selTxs.length===0
        ? h('div',{className:'empty',style:{padding:'24px 0'}},h('div',{className:'e-icon'},'📅'),h('div',{className:'e-text'},'No transactions'))
        : selTxs.map(tx=>h(TxRow,{key:tx.id,tx,showAcc:true}))
    )
  );
}

/* ── NET WORTH CHART ── */
function NetWorthChart({txs,accounts}){
  const data=useMemo(()=>{
    const baseNet=accounts.reduce((s,a)=>s+a.balance,0);
    const points=[];
    for(let i=5;i>=0;i--){
      const d=new Date();d.setMonth(d.getMonth()-i);
      const yr=d.getFullYear(),mo=d.getMonth();
      const label=MONTHS_S[mo];
      // Sum all txs from this month back
      const net=txs.filter(t=>{
        const td=new Date(t.date);
        return td.getFullYear()<yr||(td.getFullYear()===yr&&td.getMonth()<=mo);
      }).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
      points.push({label,value:baseNet+net});
    }
    return points;
  },[txs,accounts]);

  const W=320,H=120,PAD=40;
  const vals=data.map(d=>d.value);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=maxV-minV||1;
  const pts=data.map((d,i)=>{
    const x=PAD+(i/(data.length-1))*(W-PAD*2);
    const y=H-20-((d.value-minV)/range)*(H-40);
    return{x,y,label:d.label,value:d.value};
  });
  const pathD='M'+pts.map(p=>`${p.x},${p.y}`).join(' L');
  const areaD=pathD+` L${pts[pts.length-1].x},${H} L${pts[0].x},${H} Z`;
  const isUp=vals[vals.length-1]>=vals[0];

  return h('div',{className:'card'},
    h('div',{className:'card-title'},'Net Worth Trend'),
    h('svg',{viewBox:`0 0 ${W} ${H}`,className:'nw-chart',style:{width:'100%',height:H}},
      h('defs',null,
        h('linearGradient',{id:'nwgrad',x1:'0',y1:'0',x2:'0',y2:'1'},
          h('stop',{offset:'0%',stopColor:isUp?'#2ecc9a':'#f0546a',stopOpacity:.4}),
          h('stop',{offset:'100%',stopColor:isUp?'#2ecc9a':'#f0546a',stopOpacity:0})
        )
      ),
      h('path',{d:areaD,fill:'url(#nwgrad)'}),
      h('path',{d:pathD,fill:'none',stroke:isUp?'#2ecc9a':'#f0546a',strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'}),
      pts.map((p,i)=>h('g',{key:i},
        h('circle',{cx:p.x,cy:p.y,r:4,fill:isUp?'#2ecc9a':'#f0546a',stroke:'var(--card)',strokeWidth:2}),
        h('text',{x:p.x,y:H-2,textAnchor:'middle',fill:'var(--sub)',fontSize:9},p.label),
        i===pts.length-1&&h('text',{x:p.x,y:p.y-10,textAnchor:'middle',fill:isUp?'#2ecc9a':'#f0546a',fontSize:9,fontWeight:'bold'},fmtK(p.value))
      ))
    ),
    h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:8}},
      h('div',{style:{fontSize:11,color:'var(--sub)'}},
        'Start: ',h('span',{style:{color:'var(--text)',fontWeight:700}},fmtK(vals[0]))
      ),
      h('div',{style:{fontSize:11,color:isUp?'var(--green)':'var(--red)',fontWeight:700}},
        isUp?'↑':'↓',' '+(Math.abs(vals[vals.length-1]-vals[0])>0?fmtK(Math.abs(vals[vals.length-1]-vals[0])):'-')
      ),
      h('div',{style:{fontSize:11,color:'var(--sub)'}},
        'Now: ',h('span',{style:{color:'var(--text)',fontWeight:700}},fmtK(vals[vals.length-1]))
      )
    )
  );
}

/* ── EXPORT FUNCTIONS ── */
function exportCSV(txs){
  const header='Date,Type,Category,Note,Amount,Currency,Account\n';
  const rows=txs.map(t=>`${t.date},${t.type},${t.category},"${t.note||''}",${t.amount},${t.currency||'USD'},"${t.accountName||''}"`)  .join('\n');
  const blob=new Blob([header+rows],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mypocket_transactions.csv';
  a.click();
}

/* ── SUMMARY TAB ── */
function SummaryTab({txs,accounts,currency}){
  const[period,setPeriod]=useState('month');
  const now=new Date();

  const filtered=useMemo(()=>txs.filter(tx=>{
    const d=new Date(tx.date);
    if(period==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
    if(period==='year')return d.getFullYear()===now.getFullYear();
    return true;
  }),[txs,period]);

  const income=filtered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance=income-expense;
  const totalAssets=accounts.reduce((s,a)=>s+a.balance,0);

  const barData=useMemo(()=>{
    return[...Array(6)].map((_,i)=>{
      const d=new Date();d.setMonth(d.getMonth()-(5-i));
      const yr=d.getFullYear(),mo=d.getMonth();
      const inc=txs.filter(t=>{const td=new Date(t.date);return t.type==='income'&&td.getFullYear()===yr&&td.getMonth()===mo;}).reduce((s,t)=>s+t.amount,0);
      const exp=txs.filter(t=>{const td=new Date(t.date);return t.type==='expense'&&td.getFullYear()===yr&&td.getMonth()===mo;}).reduce((s,t)=>s+t.amount,0);
      return{label:MONTHS_S[mo],income:inc,expense:exp};
    });
  },[txs]);

  const expBreak=useMemo(()=>{
    const map={};
    filtered.filter(t=>t.type==='expense').forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount;});
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([name,value])=>({name,value,color:catColor(name)}));
  },[filtered]);

  // Simple donut SVG
  const DonutSVG=({data,size=120})=>{
    const R=40,CX=size/2,CY=size/2,total=data.reduce((s,d)=>s+d.value,0);
    if(!total)return null;
    let angle=-Math.PI/2;
    const slices=data.map(d=>{
      const a=(d.value/total)*Math.PI*2;
      const x1=CX+R*Math.cos(angle),y1=CY+R*Math.sin(angle);
      angle+=a;
      const x2=CX+R*Math.cos(angle),y2=CY+R*Math.sin(angle);
      return{path:`M${CX},${CY} L${x1},${y1} A${R},${R},0,${a>Math.PI?1:0},1,${x2},${y2} Z`,color:d.color};
    });
    return h('svg',{viewBox:`0 0 ${size} ${size}`,style:{width:size,height:size}},
      h('circle',{cx:CX,cy:CY,r:28,fill:'var(--card)'}),
      slices.map((s,i)=>h('path',{key:i,d:s.path,fill:s.color,stroke:'var(--card)',strokeWidth:2}))
    );
  };

  // Mini bar chart
  const BarSVG=()=>{
    const W=310,H=100,PAD=24;
    const max=Math.max(...barData.map(d=>Math.max(d.income,d.expense)),1);
    const bw=14,gap=(W-PAD*2-barData.length*bw*2)/(barData.length-1);
    return h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height:H}},
      barData.map((d,i)=>{
        const x=PAD+i*(bw*2+gap);
        const ih=((d.income/max)*(H-PAD*1.5))||1;
        const eh=((d.expense/max)*(H-PAD*1.5))||1;
        return h('g',{key:i},
          h('rect',{x,y:H-PAD-ih,width:bw,height:ih,fill:'#2ecc9a',rx:3}),
          h('rect',{x:x+bw+1,y:H-PAD-eh,width:bw,height:eh,fill:'#f0546a',rx:3}),
          h('text',{x:x+bw,y:H-2,textAnchor:'middle',fill:'#5c6585',fontSize:9},d.label)
        );
      })
    );
  };

  return h('div',null,
    h('div',{className:'pill-tabs'},
      [['month','Month'],['year','Year'],['all','All']].map(([v,l])=>
        h('button',{key:v,className:`pill-tab${period===v?' active':''}`,onClick:()=>setPeriod(v)},l)
      )
    ),
    h('div',{className:'hero pop'},
      h('div',{className:'hero-label'},'Net Balance'),
      h('div',{className:'hero-amount',style:{color:balance>=0?'var(--green)':'var(--red)'}},fmt(balance,currency)),
      h('div',{className:'hero-row'},
        h('div',null,h('div',{className:'hero-stat-lbl'},'Income'),h('div',{className:'hero-stat-val',style:{color:'var(--green)'}},'+'+fmt(income,currency))),
        h('div',{className:'hero-divider'}),
        h('div',null,h('div',{className:'hero-stat-lbl'},'Expenses'),h('div',{className:'hero-stat-val',style:{color:'var(--red)'}},'−'+fmt(expense,currency))),
        h('div',{className:'hero-divider'}),
        h('div',null,h('div',{className:'hero-stat-lbl'},'Assets'),h('div',{className:'hero-stat-val',style:{color:'var(--sky)'}},fmtK(totalAssets)))
      )
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'6-Month Flow'),
      h('div',{style:{display:'flex',gap:10,marginBottom:10}},
        h('span',{className:'chip',style:{background:'#2ecc9a22',color:'var(--green)',borderColor:'#2ecc9a44'}},'● Income'),
        h('span',{className:'chip',style:{background:'#f0546a22',color:'var(--red)',borderColor:'#f0546a44'}},'● Expenses')
      ),
      h(BarSVG)
    ),
    expBreak.length>0&&h('div',{className:'card'},
      h('div',{className:'card-title'},'Spending Breakdown'),
      h('div',{style:{display:'flex',gap:14,alignItems:'center'}},
        h(DonutSVG,{data:expBreak}),
        h('div',{style:{flex:1,display:'flex',flexDirection:'column',gap:7}},
          expBreak.map((e,i)=>
            h('div',{key:i,style:{display:'flex',alignItems:'center',gap:7}},
              h('div',{style:{width:7,height:7,borderRadius:2,background:e.color,flexShrink:0}}),
              h('div',{style:{flex:1,fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},e.name),
              h('div',{style:{fontSize:11,fontWeight:700,color:'var(--sub)'}},fmt(e.value,currency))
            )
          )
        )
      )
    ),
    h(NetWorthChart,{txs,accounts}),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'Recent'),
      filtered.length===0
        ? h('div',{className:'empty',style:{padding:'20px 0'}},h('div',{className:'e-icon'},'💸'),h('div',{className:'e-text'},'No transactions yet'))
        : filtered.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6).map(tx=>h(TxRow,{key:tx.id,tx,showAcc:true,currency}))
    )
  );
}

    return[...s].sort().reverse();

          return h('div',{key:date,style:{marginBottom:10}},
            h('div',{className:'date-hdr'},
              h('div',{className:'date-hdr-left'},new Date(date+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})),
              h('div',{className:'date-hdr-right'},
                inc>0&&h('span',{style:{color:'var(--green)'}},'+'+fmt(inc,currency)),
                exp>0&&h('span',{style:{color:'var(--red)'}},'−'+fmt(exp,currency))
              )
            ),
            h('div',{className:'card',style:{padding:'0 16px',marginBottom:0}},
              items.map(tx=>h('div',{key:tx.id,style:{position:'relative'}},
                h(TxRow,{tx,onDelete:del,showAcc:true,currency}),
                tx.receipt&&h('div',{style:{paddingBottom:10}},
                  h('img',{src:tx.receipt,style:{width:'100%',maxHeight:120,objectFit:'cover',borderRadius:10,border:'1px solid var(--border)'}})
                )
              ))
            )
          );
        }),
    editTx&&h(AddEntrySheet,{accounts,editData:editTx,onSave:updated=>{setTxs(p=>p.map(t=>t.id===updated.id?updated:t));},onClose:()=>setEditTx(null),defaultCurrency:currency})
  );
}

/* ── BUDGET TAB ── */
function BudgetTab({txs,budgets,setBudgets,currency}){
  const[editing,setEditing]=useState(null);
  const[editVal,setEditVal]=useState('');
  const now=new Date();

  const monthExp=useMemo(()=>{
    const map={};
    txs.filter(t=>{const d=new Date(t.date);return t.type==='expense'&&d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();})
      .forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount;});
    return map;
  },[txs]);

  const totalBudget=Object.values(budgets).reduce((s,v)=>s+v,0);
  const totalSpent=Object.keys(budgets).reduce((s,k)=>s+(monthExp[k]||0),0);
  const totalPct=totalBudget>0?Math.min(100,Math.round((totalSpent/totalBudget)*100)):0;
  const R=48,C=2*Math.PI*R;
  const ringColor=totalPct>85?'var(--red)':totalPct>65?'var(--amber)':'var(--green)';
  const save=()=>{const v=parseFloat(editVal);if(!isNaN(v)&&v>=0)setBudgets(p=>({...p,[editing]:v}));setEditing(null);};

  return h('div',null,
    h('div',{className:'card',style:{textAlign:'center'}},
      h('div',{className:'card-title'},'Monthly Budget'),
      h('div',{style:{display:'flex',justifyContent:'center',marginBottom:16}},
        h('div',{className:'ring-wrap'},
          h('svg',{width:130,height:130,viewBox:'0 0 130 130'},
            h('circle',{cx:65,cy:65,r:R,fill:'none',stroke:'var(--muted)',strokeWidth:10}),
            h('circle',{cx:65,cy:65,r:R,fill:'none',stroke:ringColor,strokeWidth:10,strokeLinecap:'round',
              strokeDasharray:C,strokeDashoffset:C*(1-totalPct/100),transform:'rotate(-90 65 65)',style:{transition:'stroke-dashoffset .6s ease'}})
          ),
          h('div',{className:'ring-center'},
            h('div',{style:{fontSize:22,fontWeight:800,fontFamily:'Sora',color:ringColor}},totalPct+'%'),
            h('div',{style:{fontSize:10,color:'var(--sub)'}})
          )
        )
      ),
      h('div',{style:{display:'flex',justifyContent:'center',gap:24}},
        [['Spent',fmt(totalSpent,currency),'var(--red)'],['Budget',fmt(totalBudget,currency),'var(--text)'],['Left',fmt(Math.max(0,totalBudget-totalSpent),currency),totalBudget>totalSpent?'var(--green)':'var(--red)']].map(([l,v,c])=>
          h('div',{key:l,style:{textAlign:'center'}},
            h('div',{style:{fontSize:10,fontWeight:700,color:'var(--sub)',letterSpacing:'.06em',textTransform:'uppercase'}},l),
            h('div',{style:{fontSize:15,fontWeight:800,color:c,fontFamily:'Sora',marginTop:3}},v)
          )
        )
      )
    ),
    EXP_CATS.map(cat=>{
      const limit=budgets[cat]||0;
      const spent=monthExp[cat]||0;
      const pct=limit>0?Math.min(100,Math.round((spent/limit)*100)):0;
      const over=spent>limit&&limit>0;
      const barColor=over?'var(--red)':pct>75?'var(--amber)':'var(--green)';
      return h('div',{key:cat,className:'card',style:{padding:'14px 16px'}},
        editing===cat
          ? h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
              h(CatDot,{cat,size:30}),
              h('div',{style:{flex:1,fontSize:12,fontWeight:600}},cat),
              h('input',{className:'input',type:'number',value:editVal,onChange:e=>setEditVal(e.target.value),
                style:{width:90},autoFocus:true,onKeyDown:e=>e.key==='Enter'&&save()}),
              h('button',{className:'btn-ghost',style:{color:'var(--blue)',borderColor:'var(--blue)44'},onClick:save},'Save'),
              h('button',{className:'btn-ghost',onClick:()=>setEditing(null)},'✕')
            )
          : h('div',null,
              h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:limit>0?10:0}},
                h(CatDot,{cat,size:30}),
                h('div',{style:{flex:1}},h('div',{style:{fontSize:13,fontWeight:600}},cat)),
                h('div',{style:{fontSize:12,fontWeight:700,color:over?'var(--red)':'var(--text)'}},
                  fmt(spent,currency),h('span',{style:{color:'var(--sub)',fontWeight:400}},' / '+(limit>0?fmt(limit,currency):'—'))
                ),
                h('button',{className:'btn-ghost',style:{fontSize:10},onClick:()=>{setEditing(cat);setEditVal(String(limit||''));}},'Set')
              ),
              limit>0&&h('div',{className:'progress-track'},h('div',{className:'progress-fill',style:{width:pct+'%',background:barColor}})),
              over&&h('div',{style:{fontSize:10,color:'var(--red)',marginTop:5,fontWeight:600}},'Over by '+fmt(spent-limit,currency))
            )
      );
    })
  );
}

/* ════════════════════════════════════════════
   ROOT APP
════════════════════════════════════════════ */
function App(){
  const[tab,setTab]=useState('home');
  const[showAdd,setShowAdd]=useState(false);
  const[locked,setLocked]=useState(false);
  const[deferredPrompt,setDeferredPrompt]=useState(null);
  const[showInstall,setShowInstall]=useState(false);

  const[pin,setPin]=usePersist('mp_pin','');
  const[currency,setCurrency]=usePersist('mp_currency','USD');
  const[accounts,setAccounts]=usePersist('mp_accounts_v2',[
    {id:'acc1',name:'Main Checking',type:'Checking',balance:4200,currency:'USD',note:'Primary account'},
    {id:'acc2',name:'Savings',type:'Savings',balance:12500,currency:'USD',note:'Emergency fund'},
    {id:'acc3',name:'Investments',type:'Investment',balance:8300,currency:'USD',note:'Stocks & ETFs'},
  ]);
  const[txs,setTxs]=usePersist('mp_transactions_v2',[
    {id:'t1',type:'income',category:'Salary',amount:4500,note:'Monthly salary',date:'2025-03-01',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t2',type:'expense',category:'Housing',amount:1200,note:'Rent',date:'2025-03-02',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t3',type:'expense',category:'Food',amount:85,note:'Groceries',date:'2025-03-04',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t4',type:'expense',category:'Transport',amount:42,note:'Fuel',date:'2025-03-05',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t5',type:'income',category:'Investment',amount:230,note:'Dividend',date:'2025-03-10',accountId:'acc3',accountName:'Investments',currency:'USD'},
    {id:'t6',type:'expense',category:'Entertainment',amount:55,note:'Netflix',date:'2025-03-11',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t7',type:'expense',category:'Food',amount:120,note:'Team lunch',date:'2025-03-13',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t8',type:'expense',category:'Shopping',amount:190,note:'New shoes',date:'2025-03-15',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t9',type:'income',category:'Freelance',amount:850,note:'Web project',date:'2025-03-18',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t10',type:'expense',category:'Health',amount:60,note:'Gym',date:'2025-03-20',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
  ]);
  const[budgets,setBudgets]=usePersist('mp_budgets_v2',{
    Food:600,Housing:1500,Transport:200,Health:200,
    Entertainment:150,Shopping:300,Utilities:180,Education:100,Travel:400,Subscriptions:80,Savings:500,Other:100
  });
  const[reminders,setReminders]=usePersist('mp_reminders',[
    {id:'r1',name:'Rent',category:'Housing',amount:1200,dueDay:1,currency:'USD',paidThisMonth:false},
    {id:'r2',name:'Netflix',category:'Subscriptions',amount:15,dueDay:5,currency:'USD',paidThisMonth:false},
    {id:'r3',name:'Electricity',category:'Utilities',amount:80,dueDay:10,currency:'USD',paidThisMonth:false},
  ]);

  // Lock on load if PIN set
  useEffect(()=>{if(pin)setLocked(true);},[]);

  // PWA install prompt
  useEffect(()=>{
    const h=e=>{e.preventDefault();setDeferredPrompt(e);setShowInstall(true);};
    window.addEventListener('beforeinstallprompt',h);
    return()=>window.removeEventListener('beforeinstallprompt',h);
  },[]);

  // Auto-process recurring transactions
  useEffect(()=>{
    const lastRun=LS.get('mp_rec_lastrun','');
    const todayStr=today();
    if(lastRun===todayStr)return;
    LS.set('mp_rec_lastrun',todayStr);
    const todayDate=new Date(todayStr);
    txs.filter(t=>t.recurring).forEach(t=>{
      const orig=new Date(t.date);
      let next=new Date(orig);
      // advance until next is today or past
      while(next<todayDate){
        if(t.recFreq==='daily')next.setDate(next.getDate()+1);
        else if(t.recFreq==='weekly')next.setDate(next.getDate()+7);
        else if(t.recFreq==='monthly')next.setMonth(next.getMonth()+1);
        else if(t.recFreq==='yearly')next.setFullYear(next.getFullYear()+1);
        else break;
        const nextStr=next.toISOString().split('T')[0];
        if(nextStr===todayStr){
          setTxs(p=>[...p,{...t,id:genId(),date:todayStr,note:(t.note||t.category)+' (auto)'}]);
          break;
        }
      }
    });
  },[]);

  const addTx=tx=>{
    setTxs(p=>[tx,...p]);
    setAccounts(prev=>prev.map(a=>{
      if(a.id!==tx.accountId)return a;
      const delta=tx.type==='income'?tx.amount:-tx.amount;
      return{...a,balance:a.balance+delta};
    }));
  };

  const installApp=async()=>{
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    const{outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted')setShowInstall(false);
    setDeferredPrompt(null);
  };

  const NAV=[
    {id:'home',icon:'🏠',label:'Home'},
    {id:'accounts',icon:'🏦',label:'Accounts'},
    {id:'records',icon:'📋',label:'Records'},
    {id:'calendar',icon:'📅',label:'Calendar'},
    {id:'more',icon:'⚙️',label:'More'},
  ];

  const tabLabels={home:'Home',accounts:'Accounts',records:'Records',calendar:'Calendar',budget:'Budget',reminders:'Reminders',settings:'Settings',more:'More'};

  // "More" sub tabs
  const[moreTab,setMoreTab]=useState('budget');
  const MORE_TABS=[
    {id:'budget',icon:'🎯',label:'Budget'},
    {id:'reminders',icon:'🔔',label:'Bills'},
    {id:'settings',icon:'⚙️',label:'Settings'},
  ];

  if(locked&&pin){
    return h(PinScreen,{mode:'verify',savedPin:pin,onUnlock:()=>setLocked(false),onSetPin:setPin});
  }

  return h('div',null,
    // Topbar
    h('div',{className:'topbar'},
      h('div',{className:'topbar-logo'},
        h('div',{className:'topbar-icon'},'👛'),
        h('div',null,
          h('div',{className:'topbar-title'},'MyPocket'),
          h('div',{className:'topbar-sub'},tabLabels[tab==='more'?moreTab:tab])
        )
      ),
      h('div',{className:'topbar-actions'},
        pin&&h('button',{className:'topbar-btn ghost',onClick:()=>setLocked(true),title:'Lock'},'🔐'),
        h('button',{className:'topbar-btn',onClick:()=>setShowAdd(true)},'+')
      )
    ),

    // Content
    h('div',{className:'page',key:tab==='more'?'more_'+moreTab:tab},
      showInstall&&h('div',{className:'install-banner'},
        h('div',{className:'ib-icon'},'📱'),
        h('div',{className:'ib-text'},h('div',{className:'ib-title'},'Install MyPocket'),h('div',{className:'ib-sub'},'Add to home screen')),
        h('button',{className:'ib-btn',onClick:installApp},'Install'),
        h('button',{style:{background:'none',border:'none',color:'var(--sub)',cursor:'pointer',fontSize:16,marginLeft:4},onClick:()=>setShowInstall(false)},'✕')
      ),
      tab==='home'&&h(SummaryTab,{txs,accounts,currency}),
      tab==='accounts'&&h(AccountsTab,{accounts,setAccounts,txs,currency}),
      tab==='records'&&h(TransactionsTab,{txs,setTxs,accounts,currency}),
      tab==='calendar'&&h(CalendarTab,{txs}),
      tab==='more'&&h('div',null,
        h('div',{className:'pill-tabs'},
          MORE_TABS.map(t=>h('button',{key:t.id,className:`pill-tab${moreTab===t.id?' active':''}`,onClick:()=>setMoreTab(t.id)},t.icon+' '+t.label))
        ),
        moreTab==='budget'&&h(BudgetTab,{txs,budgets,setBudgets,currency}),
        moreTab==='reminders'&&h(RemindersTab,{reminders,setReminders}),
        moreTab==='settings'&&h(SettingsTab,{pin,setPin,currency,setCurrency,txs,accounts})
      )
    ),

    // Bottom nav
    h('div',{className:'bottomnav'},
      NAV.map(n=>h('button',{key:n.id,className:`nav-btn${tab===n.id?' active':''}`,onClick:()=>setTab(n.id)},
        h('span',{className:'icon'},n.icon),
        h('span',{className:'label'},n.label),
        tab===n.id&&h('div',{className:'pip'})
      ))
    ),

    showAdd&&h(AddEntrySheet,{accounts,onSave:addTx,onClose:()=>setShowAdd(false),defaultCurrency:currency})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body>
</html>
