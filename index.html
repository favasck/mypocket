<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#0d0f18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MyPocket"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="/manifest.json"/>
<title>MyPocket</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f18;--surf:#141720;--card:#1a1e2e;--raised:#1f2438;
  --border:#262d42;--muted:#2e3650;--text:#e8ecf8;--sub:#5c6585;--dim:#3a4260;
  --green:#2ecc9a;--red:#f0546a;--blue:#4a90f5;--indigo:#7c6ef7;
  --amber:#f5a623;--sky:#38c8f5;--violet:#b06ef7;--rose:#fb7185;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

/* ── PIN ── */
.pin-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;max-width:480px;margin:0 auto}
.pin-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 8px 32px #4a90f540}
.pin-title{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px}
.pin-sub{font-size:13px;color:var(--sub);margin-bottom:32px;text-align:center}
.pin-dots{display:flex;gap:16px;margin-bottom:32px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue);transform:scale(1.1)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px}
.pin-key{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;font-size:22px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:all .15s;color:var(--text)}
.pin-key:active{background:var(--raised);transform:scale(.94)}
.pin-key.del{font-size:18px;color:var(--sub)}
.pin-key.empty{background:transparent;border-color:transparent;cursor:default}
.pin-err{color:var(--red);font-size:13px;font-weight:600;margin-top:12px;min-height:18px}

/* ── LAYOUT ── */
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(80px + var(--safe-bot));padding-top:calc(16px + var(--safe-top));-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}

/* ── TOPBAR ── */
.topbar{background:var(--surf);border-bottom:1px solid var(--border);padding:0 18px;height:calc(56px + var(--safe-top));padding-top:var(--safe-top);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;flex-shrink:0}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 14px #4a90f540}
.topbar-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.02em}
.topbar-sub{font-size:10px;color:var(--sub);margin-top:1px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.topbar-btn{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#4a90f5,#7c6ef7);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #4a90f540;transition:transform .15s}
.topbar-btn:active{transform:scale(.92)}
.topbar-btn.ghost{background:var(--card);border:1px solid var(--border);font-size:16px;box-shadow:none;color:var(--sub)}

/* ── BOTTOM NAV ── */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:var(--safe-bot)}
.nav-btn{flex:1;padding:10px 0 6px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;color:var(--dim);transition:color .15s}
.nav-btn.active{color:var(--blue)}
.nav-btn .n-icon{font-size:20px;line-height:1}
.nav-btn .n-label{font-size:10px;font-weight:700;letter-spacing:.04em}
.nav-btn .pip{width:18px;height:2px;border-radius:1px;background:var(--blue);margin-top:2px}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px}
.sec-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:block}

/* ── INPUTS ── */
.input{width:100%;background:var(--raised);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px 14px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;appearance:none;-webkit-appearance:none}
.input:focus{border-color:var(--blue)}
.input::placeholder{color:var(--sub)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── BUTTONS ── */
.btn-primary{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:'Sora',sans-serif;letter-spacing:.02em;box-shadow:0 4px 20px #4a90f530;transition:transform .15s,opacity .15s}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-primary.green{background:linear-gradient(135deg,#2ecc9a,#1aaa7e);box-shadow:0 4px 20px #2ecc9a30}
.btn-primary.red{background:linear-gradient(135deg,#f0546a,#d03050);box-shadow:0 4px 20px #f0546a30}
.btn-primary.amber{background:linear-gradient(135deg,#f5a623,#d4881a)}
.btn-primary.violet{background:linear-gradient(135deg,#7c6ef7,#5a4ed4)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--sub);border-radius:10px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ghost:active{background:var(--muted)}
.btn-back{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;padding:0;margin-bottom:18px;font-family:inherit;display:flex;align-items:center;gap:5px}
.btn-icon{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--sub);font-size:16px;transition:all .15s}
.btn-icon:active{background:var(--muted)}

/* ── PILLS ── */
.pill-tabs{display:flex;background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.pill-tab{flex:1;padding:8px 4px;border:none;cursor:pointer;background:transparent;color:var(--sub);font-weight:700;font-size:12px;font-family:inherit;transition:all .15s}
.pill-tab.active{background:var(--blue);color:#fff}

/* ── TYPE TOGGLE ── */
.type-toggle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.type-btn{padding:12px 0;border-radius:14px;border:1px solid var(--border);cursor:pointer;font-weight:800;font-size:16px;font-family:'Sora',sans-serif;transition:all .2s;background:var(--card);color:var(--sub)}
.type-btn span{display:block;font-size:10px;font-weight:700;margin-top:3px}
.type-btn.income.active{background:#2ecc9a22;color:var(--green);border-color:#2ecc9a55}
.type-btn.expense.active{background:#f0546a22;color:var(--red);border-color:#f0546a55}
.type-btn.transfer.active{background:#4a90f522;color:var(--blue);border-color:#4a90f555}

/* ── CAT GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.cat-btn{padding:9px 4px;border-radius:12px;border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;background:var(--card);font-family:inherit}
.cat-btn .cat-icon{font-size:18px}
.cat-btn .cat-name{font-size:9px;font-weight:700;color:var(--sub);text-align:center;line-height:1.2}
.cat-btn.selected .cat-name{color:inherit}

/* ── TX ROW ── */
.tx-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #26334214}
.tx-row:last-child{border-bottom:none}
.tx-icon{border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-main{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-del{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px;flex-shrink:0}

/* ── HERO ── */
.hero{background:linear-gradient(145deg,#162040,#0f1628);border:1px solid #2a4080aa;border-radius:22px;padding:22px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#4a90f518,transparent 70%);top:-60px;right:-40px;pointer-events:none}
.hero-label{font-size:11px;font-weight:700;color:#7090d0;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.hero-amount{font-family:'Sora',sans-serif;font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-row{display:flex;justify-content:center;gap:24px;margin-top:16px;flex-wrap:wrap}
.hero-stat-lbl{font-size:10px;font-weight:700;color:#7090d0;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.hero-stat-val{font-size:15px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}
.hero-divider{width:1px;background:#2a4080}

/* ── STAT ROW ── */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 12px}
.stat-lbl{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-size:18px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}

/* ── ACC CARD ── */
.acc-card{border-radius:18px;padding:16px 18px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.acc-card:active{transform:scale(.98)}
.acc-card-badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.acc-card-name{font-size:15px;font-weight:800;font-family:'Sora',sans-serif;margin-bottom:2px}
.acc-card-bal{font-size:24px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}
.acc-card-sub{font-size:11px;opacity:.6;margin-top:4px}
.acc-card-glow{position:absolute;width:100px;height:100px;border-radius:50%;opacity:.18;top:-20px;right:-15px}

/* ── PROGRESS ── */
.progress-track{height:6px;background:var(--muted);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}

/* ── AMOUNT INPUT ── */
.amount-hero{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;text-align:center}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:#000c;z-index:400;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
.modal-sheet{background:var(--surf);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--safe-bot));width:100%;max-height:93vh;overflow-y:auto;animation:slideUp .25s ease}
.modal-handle{width:36px;height:4px;background:var(--muted);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:17px;font-weight:800;font-family:'Sora',sans-serif;margin-bottom:18px}

/* ── CALENDAR ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px 10px;border-radius:8px;font-family:inherit}
.cal-month{font-family:'Sora',sans-serif;font-size:16px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day-name{font-size:9px;font-weight:700;color:var(--sub);text-align:center;padding:4px 0}
.cal-day{min-height:40px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px 3px;cursor:pointer;transition:background .15s}
.cal-day:active{background:var(--muted)}
.cal-day.today .cal-day-num{background:var(--blue);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-day.selected{background:var(--raised);border:1px solid #4a90f544}
.cal-day.other-month .cal-day-num{color:var(--dim)}
.cal-day-num{font-size:12px;font-weight:600;line-height:1;margin-bottom:3px}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal-dot{width:4px;height:4px;border-radius:50%}

/* ── DATE GROUP ── */
.date-hdr{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;margin-bottom:4px}
.date-hdr-left{font-size:11px;font-weight:700;color:var(--sub)}
.date-hdr-right{display:flex;gap:8px;font-size:11px;font-weight:700}

/* ── RING ── */
.ring-wrap{position:relative;display:inline-block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── SEARCHBAR ── */
.searchbar{position:relative;margin-bottom:12px}
.searchbar .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px;pointer-events:none}
.searchbar input{padding-left:34px}

/* ── RECEIPT ── */
.receipt-preview{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-bottom:8px;border:1px solid var(--border)}
.receipt-placeholder{width:100%;height:80px;border-radius:12px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;margin-bottom:8px;color:var(--sub);font-size:12px;font-weight:600}

/* ── AI CHAT ── */
.chat-messages{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;min-height:200px;max-height:50vh;overflow-y:auto}
.chat-messages::-webkit-scrollbar{display:none}
.chat-bubble{max-width:85%;padding:12px 15px;border-radius:16px;font-size:13px;line-height:1.55}
.chat-bubble.user{background:linear-gradient(135deg,#4a90f5,#7c6ef7);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.ai{background:var(--card);border:1px solid var(--border);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.ai.loading{opacity:.6}
.chat-input-row{display:flex;gap:8px}
.chat-input{flex:1;background:var(--raised);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px 14px;font-size:14px;outline:none;font-family:inherit}
.chat-input:focus{border-color:var(--blue)}
.chat-send{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-suggestion{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text);font-family:inherit}
.chat-suggestion:active{background:var(--raised)}

/* ── GOALS ── */
.goal-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.goal-icon{font-size:28px;margin-bottom:8px}
.goal-name{font-size:15px;font-weight:800;font-family:'Sora',sans-serif;margin-bottom:4px}
.goal-amounts{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.goal-pct{font-size:11px;color:var(--sub);margin-top:6px}
.goal-deadline{font-size:10px;font-weight:700;color:var(--sub);margin-top:6px}

/* ── INSIGHT CARD ── */
.insight-card{border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid}
.insight-icon{font-size:22px;margin-bottom:6px}
.insight-title{font-size:13px;font-weight:700;margin-bottom:4px}
.insight-body{font-size:12px;line-height:1.55}

/* ── MANAGE LIST ROW ── */
.manage-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)22}
.manage-row:last-child{border-bottom:none}
.manage-drag{color:var(--dim);font-size:16px;cursor:grab;padding:4px;flex-shrink:0}
.manage-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.manage-info{flex:1;min-width:0}
.manage-name{font-size:13px;font-weight:700}
.manage-sub{font-size:11px;color:var(--sub);margin-top:1px}
.manage-actions{display:flex;gap:6px;flex-shrink:0}

/* ── EMOJI PICKER ── */
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;max-height:180px;overflow-y:auto}
.emoji-btn{padding:8px 4px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:20px;transition:background .12s}
.emoji-btn:active{background:var(--muted)}
.emoji-btn.selected{background:var(--raised);outline:2px solid var(--blue)}

/* ── COLOR PICKER ── */
.color-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:transform .15s;border:2px solid transparent}
.color-swatch.selected{transform:scale(1.2);border-color:var(--text)}

/* ── CHIP ── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid}

/* ── TRANSFER ARROW ── */
.transfer-arrow{display:flex;align-items:center;justify-content:center;padding:4px 0;color:var(--blue);font-size:20px;font-weight:700}

/* ── INSTALL BANNER ── */
.install-banner{background:linear-gradient(135deg,#1a2a50,#1a1e38);border:1px solid #2a4080aa;border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}

/* ── REMINDER ROW ── */
.reminder-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)33}
.reminder-row:last-child{border-bottom:none}

/* ── MISC ── */
.empty{text-align:center;padding:40px 0;color:var(--sub)}
.empty .e-icon{font-size:36px;margin-bottom:10px}
.empty .e-text{font-size:13px}
.err{color:var(--red);font-size:12px;margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:14px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.rec-badge{background:#7c6ef722;border:1px solid #7c6ef744;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700;color:var(--indigo)}
.transfer-badge{background:#4a90f522;border:1px solid #4a90f544;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700;color:var(--blue)}

input[type="date"],input[type="number"]{color-scheme:dark}
select option{background:var(--card)}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pop{animation:pop .25s ease forwards}
.shake{animation:shake .3s ease}
.pulse{animation:pulse 1.4s ease infinite}
</style>
</head>
<body>

/* ════ PERSIST ════ */
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
function usePersist(key,def){
  const[val,setVal]=useState(()=>LS.get(key,def));
  const set=useCallback(v=>{setVal(prev=>{const next=typeof v==='function'?v(prev):v;LS.set(key,next);return next;});},[ key]);
  return[val,set];
}

/* ════ PIN SCREEN ════ */
function PinScreen({mode,savedPin,onUnlock,onSetPin}){
  const[input,setInput]=useState('');
  const[confirm,setConfirm]=useState('');
  const[step,setStep]=useState(mode==='set'?'enter':'verify');
  const[err,setErr]=useState('');
  const[shake,setShake]=useState(false);
  const doShake=()=>{setShake(true);setTimeout(()=>setShake(false),400);};
  const press=key=>{
    if(key==='del'){step==='confirm'?setConfirm(p=>p.slice(0,-1)):setInput(p=>p.slice(0,-1));return;}
    const nv=(step==='confirm'?confirm:input)+key;
    step==='confirm'?setConfirm(nv):setInput(nv);
    if(nv.length===4){
      if(step==='enter'&&mode==='set'){setStep('confirm');setErr('');}
      else if(step==='confirm'){if(nv===input){onSetPin(input);onUnlock();}else{setErr('PINs do not match');setConfirm('');doShake();}}
      else if(step==='verify'){if(nv===savedPin){onUnlock();}else{setErr('Incorrect PIN');setInput('');doShake();}}
    }
  };
  const cur=step==='confirm'?confirm:input;
  const sub=mode==='set'?(step==='enter'?'Create a 4-digit PIN':'Confirm your PIN'):'Enter your PIN';
  return h('div',{className:'pin-screen'},
    h('div',{className:'pin-logo'},'👛'),
    h('div',{className:'pin-title'},'MyPocket'),
    h('div',{className:'pin-sub'},sub),
    h('div',{className:`pin-dots${shake?' shake':''}`,key:step},
      [0,1,2,3].map(i=>h('div',{key:i,className:`pin-dot${cur.length>i?' filled':''}${err&&cur.length===0?' error':''}`}))
    ),
    h('div',{className:'pin-pad'},
      ['1','2','3','4','5','6','7','8','9','','0','del'].map((k,i)=>
        k===''?h('div',{key:i,className:'pin-key empty'}):
        h('button',{key:i,className:`pin-key${k==='del'?' del':''}`,onClick:()=>press(k)},k==='del'?'⌫':k)
      )
    ),
    h('div',{className:'pin-err'},err)
  );
}

/* ════ MANAGE CATEGORIES ════ */
function ManageCategories({cats,setCats,onClose}){
  const[view,setView]=useState('list'); // list | add | edit
  const[editData,setEditData]=useState(null);
  const[typeFilter,setTypeFilter]=useState('expense');

  const saveCat=cat=>{setCats(p=>p.find(c=>c.id===cat.id)?p.map(c=>c.id===cat.id?cat:c):[...p,cat]);setView('list');};
  const del=id=>{if(confirm('Delete category? Transactions will keep the old name.'))setCats(p=>p.filter(c=>c.id!==id));};
  const move=(i,dir,filtered)=>{
    setCats(prev=>{
      const arr=[...prev];
      const fromIdx=arr.findIndex(c=>c.id===filtered[i].id);
      const toIdx=arr.findIndex(c=>c.id===filtered[i+dir]?.id);
      if(toIdx<0)return arr;
      [arr[fromIdx],arr[toIdx]]=[arr[toIdx],arr[fromIdx]];
      return arr;
    });
  };

  if(view==='add'||view==='edit')return h(CategoryForm,{data:editData,defaultType:typeFilter,onSave:saveCat,onCancel:()=>setView('list')});

  const filtered=cats.filter(c=>c.type===typeFilter);
  return h('div',null,
    h('div',{className:'modal-title'},'Manage Categories'),
    h('div',{className:'pill-tabs'},
      [['expense','Expenses'],['income','Income']].map(([v,l])=>h('button',{key:v,className:`pill-tab${typeFilter===v?' active':''}`,onClick:()=>setTypeFilter(v)},l))
    ),
    filtered.length===0&&h('div',{className:'empty',style:{padding:'24px 0'}},h('div',{className:'e-icon'},'🗂'),h('div',{className:'e-text'},'No categories')),
    filtered.map((cat,i)=>

          h('button',{className:'btn-icon',style:{fontSize:12,padding:2},onClick:()=>move(i,-1,filtered)},'▲'),
          h('button',{className:'btn-icon',style:{fontSize:12,padding:2},onClick:()=>move(i,1,filtered)},'▼')
        ),
        h('div',{className:'manage-icon',style:{background:cat.color+'22',border:`1px solid ${cat.color}44`}},cat.icon),
        h('div',{className:'manage-info'},h('div',{className:'manage-name'},cat.name),h('div',{className:'manage-sub'},cat.type)),
        h('div',{className:'manage-actions'},
          h('button',{className:'btn-ghost',style:{fontSize:11},onClick:()=>{setEditData(cat);setView('edit');}},'✏️'),
          !cat.id.startsWith('c_')&&h('button',{className:'btn-ghost',style:{fontSize:11,color:'var(--red)',borderColor:'var(--red)33'},onClick:()=>del(cat.id)},'🗑')
        )
      )
    ),
    h('div',{style:{marginTop:12}},h('button',{className:'btn-primary',onClick:()=>{setEditData(null);setView('add');}},'+ Add Category'))
  );
}

function AddEntrySheet({accounts,cats,onSave,onClose,defaultCurrency}){

  const[toAccId,setToAccId]=useState(accounts[1]?.id||accounts[0]?.id||'');
  const[cur,setCur]=useState(defaultCurrency||'USD');
  const[receipt,setReceipt]=useState(null);
  const[recurring,setRecurring]=useState(false);
  const[recFreq,setRecFreq]=useState('monthly');
  const[err,setErr]=useState('');
  const fileRef=useRef();

  const availCats=cats.filter(c=>c.type===type);

  const handlePhoto=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setReceipt(ev.target.result);r.readAsDataURL(f);};

  const submit=()=>{
    if(type!=='transfer'&&!catId)return setErr('Pick a category.');
    if(!amt||+amt<=0)return setErr('Enter a valid amount.');

        {id:genId(),type:'transfer',categoryId:'transfer_out',category:'Transfer',amount:+amt,note:note.trim()||'Transfer',date,accountId:accId,accountName:acc?.name||'',currency:cur,toAccountId:toAccId,toAccountName:toAcc?.name||'',transferDir:'out'},
        {id:genId(),type:'transfer',categoryId:'transfer_in',category:'Transfer',amount:+amt,note:note.trim()||'Transfer',date,accountId:toAccId,accountName:toAcc?.name||'',currency:cur,fromAccountId:accId,fromAccountName:acc?.name||'',transferDir:'in'},
      ]);
    } else {
      onSave([{id:genId(),type,categoryId:catId,category:cat?.name||'',amount:+amt,note:note.trim(),date,accountId:accId,accountName:acc?.name||'',currency:cur,receipt,recurring,recFreq:recurring?recFreq:null}]);
    }
    onClose();
  };

  return h('div',{className:'modal-bg',onClick:e=>e.target===e.currentTarget&&onClose()},

      h('div',{className:'modal-handle'}),

/* ════ AI ASSISTANT ════ */
function AIAssistant({txs,accounts,cats,budgets,currency}){
  const[messages,setMessages]=useState([{role:'ai',text:"Hi! I'm your MyPocket AI assistant 👋 Ask me anything about your finances — spending habits, savings tips, budget analysis, and more."}]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const msgEndRef=useRef();

  useEffect(()=>{msgEndRef.current?.scrollIntoView({behavior:'smooth'});},[ messages]);

  const buildContext=()=>{
    const now=new Date();
    const thisMonthTxs=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
    const totalInc=thisMonthTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const totalExp=thisMonthTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const catMap={};
    thisMonthTxs.filter(t=>t.type==='expense').forEach(t=>{const c=cats.find(x=>x.id===t.categoryId);const n=c?.name||t.category;catMap[n]=(catMap[n]||0)+t.amount;});
    const topCats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,v])=>`${n}: $${v}`).join(', ');
    const accSummary=accounts.map(a=>`${a.name} (${a.type}): ${fmt(a.balance,a.currency||'USD')}`).join(', ');
    const totalNet=accounts.reduce((s,a)=>s+a.balance,0);
    return`User's financial data summary:
- Currency: ${currency}
- This month income: $${totalInc.toFixed(0)}, expenses: $${totalExp.toFixed(0)}, net: $${(totalInc-totalExp).toFixed(0)}
- Top expense categories this month: ${topCats||'none yet'}
- Accounts: ${accSummary||'none'}
- Total net worth: $${totalNet.toFixed(0)}
- Total transactions: ${txs.length}
- Budget set: ${Object.entries(budgets).map(([k,v])=>`${k}:$${v}`).join(', ')}
Be a helpful personal finance assistant. Give specific, actionable advice based on this data. Keep responses concise (2-4 sentences max). Use numbers from the data when relevant.`;
  };

  const send=async(text)=>{
    const q=text||input.trim();
    if(!q||loading)return;
    setInput('');
    setMessages(p=>[...p,{role:'user',text:q}]);
    setLoading(true);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1000,
          system:buildContext(),
          messages:[...messages.filter(m=>m.role!=='ai'||messages.indexOf(m)>0).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text})),{role:'user',content:q}]
        })
      });
      const data=await res.json();
      const reply=data.content?.[0]?.text||'Sorry, I could not get a response.';
      setMessages(p=>[...p,{role:'ai',text:reply}]);
    }catch(e){
      setMessages(p=>[...p,{role:'ai',text:'Connection error. Please try again.'}]);
    }
    setLoading(false);
  };

  const suggestions=['How am I doing this month?','Where am I overspending?','How can I save more?','What\'s my biggest expense?'];

  return h('div',null,
    h('div',{style:{background:'linear-gradient(135deg,#1a2040,#0f1428)',border:'1px solid #4a90f544',borderRadius:18,padding:'14px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:12}},
      h('div',{style:{width:40,height:40,borderRadius:12,background:'linear-gradient(135deg,#4a90f5,#7c6ef7)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}},'🤖'),
      h('div',null,h('div',{style:{fontSize:14,fontWeight:800,fontFamily:'Sora'}}),'AI Financial Assistant',h('div',{style:{fontSize:11,color:'#7090d0',marginTop:2}},'Powered by Claude · Your data stays private'))
    ),
    h('div',{className:'card',style:{padding:'16px'}},
      h('div',{className:'chat-messages'},
        messages.map((m,i)=>h('div',{key:i,className:`chat-bubble ${m.role}${m.loading?' loading':''}`},m.text)),
        loading&&h('div',{className:'chat-bubble ai loading pulse'},'Thinking…'),
        h('div',{ref:msgEndRef})
      ),
      messages.length===1&&h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}},
        suggestions.map(s=>h('button',{key:s,className:'chat-suggestion',onClick:()=>send(s)},s))
      ),
      h('div',{className:'chat-input-row'},
        h('input',{className:'chat-input',placeholder:'Ask about your finances…',value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==='Enter'&&send(),disabled:loading}),
        h('button',{className:'chat-send',onClick:()=>send(),disabled:loading},'↑')
      )
    )
  );
}

/* ════ FINANCIAL GOALS ════ */
function GoalsTab({goals,setGoals,accounts,currency}){
  const[showAdd,setShowAdd]=useState(false);
  const[editGoal,setEditGoal]=useState(null);
  const[form,setForm]=useState({name:'',icon:'🎯',target:0,saved:0,deadline:'',accountId:'',note:''});
  const[err,setErr]=useState('');

  const openAdd=()=>{setForm({name:'',icon:'🎯',target:'',saved:'',deadline:'',accountId:accounts[0]?.id||'',note:''});setEditGoal(null);setShowAdd(true);};
  const openEdit=g=>{setForm({...g,target:String(g.target),saved:String(g.saved)});setEditGoal(g);setShowAdd(true);};
  const save=()=>{
    if(!form.name.trim())return setErr('Name required.');
    if(!form.target||+form.target<=0)return setErr('Set a target amount.');
    const obj={id:editGoal?.id||genId(),...form,target:+form.target,saved:+form.saved||0};
    setGoals(p=>editGoal?p.map(g=>g.id===obj.id?obj:g):[...p,obj]);
    setShowAdd(false);setErr('');
  };
  const del=id=>setGoals(p=>p.filter(g=>g.id!==id));
  const addFunds=(id,amt)=>setGoals(p=>p.map(g=>g.id===id?{...g,saved:Math.min(g.target,g.saved+amt)}:g));

  const GOAL_ICONS=['🎯','🚗','🏠','✈️','💍','🎓','💻','📱','🏖️','🛡️','👶','🐾','💪','🌟','🎁','🏆'];

  if(showAdd){
    return h('div',null,
      h('button',{className:'btn-back',onClick:()=>setShowAdd(false)},'← Back'),
      h('div',{style:{fontSize:16,fontWeight:800,fontFamily:'Sora',marginBottom:18}},editGoal?'Edit Goal':'New Goal'),
      h('div',{className:'field'},h('label',null,'Icon'),
        h('div',{style:{display:'flex',gap:6,flexWrap:'wrap',marginBottom:0}},
          GOAL_ICONS.map(ic=>h('button',{key:ic,className:`emoji-btn${form.icon===ic?' selected':''}`,onClick:()=>setForm(p=>({...p,icon:ic}))},ic))
        )
      ),
      h('div',{className:'field'},h('label',null,'Goal Name'),h('input',{className:'input',type:'text',placeholder:'e.g. New Car, Vacation',value:form.name,onChange:e=>setForm(p=>({...p,name:e.target.value}))})),
      h('div',{className:'field-row'},
        h('div',{className:'field'},h('label',null,'Target ($)'),h('input',{className:'input',type:'number',placeholder:'5000',value:form.target,onChange:e=>setForm(p=>({...p,target:e.target.value}))})),
        h('div',{className:'field'},h('label',null,'Saved so far ($)'),h('input',{className:'input',type:'number',placeholder:'0',value:form.saved,onChange:e=>setForm(p=>({...p,saved:e.target.value}))}))
      ),
      h('div',{className:'field'},h('label',null,'Target Date (optional)'),h('input',{className:'input',type:'date',value:form.deadline,onChange:e=>setForm(p=>({...p,deadline:e.target.value}))})),
      h('div',{className:'field'},h('label',null,'Notes (optional)'),h('input',{className:'input',type:'text',placeholder:'What this goal is for',value:form.note,onChange:e=>setForm(p=>({...p,note:e.target.value}))})),
      err&&h('div',{className:'err'},err),
      h('button',{className:'btn-primary violet',onClick:save},editGoal?'Save Changes':'Create Goal')
    );
  }

  const totalGoals=goals.reduce((s,g)=>s+g.target,0);
  const totalSaved=goals.reduce((s,g)=>s+g.saved,0);

  return h('div',null,
    goals.length>0&&h('div',{className:'stat-row'},
      h('div',{className:'stat-box'},h('div',{className:'stat-lbl'},'Goals'),h('div',{className:'stat-val'},goals.length)),
      h('div',{className:'stat-box'},h('div',{className:'stat-lbl'},'Saved'),h('div',{className:'stat-val',style:{color:'var(--green)'}},fmtK(totalSaved))),
      h('div',{className:'stat-box'},h('div',{className:'stat-lbl'},'Target'),h('div',{className:'stat-val',style:{color:'var(--sky)'}},fmtK(totalGoals)))
    ),
    goals.length===0&&h('div',{className:'empty'},h('div',{className:'e-icon'},'🎯'),h('div',{className:'e-text'},'Set your first financial goal')),
    goals.map(g=>{
      const pct=g.target>0?Math.min(100,Math.round((g.saved/g.target)*100)):0;
      const done=pct>=100;
      const daysLeft=g.deadline?Math.ceil((new Date(g.deadline)-new Date())/(1000*60*60*24)):null;
      const monthlyNeeded=daysLeft&&daysLeft>0&&!done?Math.ceil((g.target-g.saved)/(daysLeft/30)):null;
      return h('div',{key:g.id,className:'goal-card'},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
          h('div',null,
            h('div',{className:'goal-icon'},g.icon),
            h('div',{className:'goal-name'},g.name),
            g.note&&h('div',{style:{fontSize:11,color:'var(--sub)',marginBottom:4}},g.note)
          ),
          h('div',{style:{display:'flex',gap:6}},
            h('button',{className:'btn-ghost',style:{fontSize:11},onClick:()=>openEdit(g)},'✏️'),
            h('button',{className:'btn-ghost',style:{fontSize:11,color:'var(--red)',borderColor:'var(--red)33'},onClick:()=>del(g.id)},'🗑')
          )
        ),
        h('div',{className:'goal-amounts'},
          h('span',{style:{color:'var(--green)',fontWeight:700}},fmt(g.saved,currency)+' saved'),
          h('span',{style:{color:'var(--sub)'}},fmt(g.target,currency)+' goal')
        ),
        h('div',{className:'progress-track',style:{height:8}},
          h('div',{className:'progress-fill',style:{width:pct+'%',background:done?'var(--green)':pct>60?'var(--amber)':'var(--blue)'}})
        ),
        h('div',{className:'goal-pct'},pct+'% complete'+(done?' 🎉':'')),
        g.deadline&&h('div',{className:'goal-deadline'},
          done?'✅ Goal reached!':`⏱ ${daysLeft>0?daysLeft+' days left':'Deadline passed'}${monthlyNeeded?' · save '+fmt(monthlyNeeded,currency)+'/mo to reach it':''}`
        ),
        !done&&h('div',{style:{marginTop:10,display:'flex',gap:8}},
          [50,100,500].map(amt=>h('button',{key:amt,className:'btn-ghost',style:{flex:1,fontSize:11},onClick:()=>addFunds(g.id,amt)},'+'+fmt(amt,currency)))
        )
      );
    }),
    h('button',{className:'btn-primary violet',style:{marginTop:8},onClick:openAdd},'+ New Goal')
  );
}

/* ════ SMART INSIGHTS ════ */
function InsightsCard({txs,budgets,cats,currency}){
  const now=new Date();
  const insights=useMemo(()=>{
    const result=[];
    const thisMonth=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
    const lastMonth=txs.filter(t=>{const d=new Date(t.date);const lm=new Date(now);lm.setMonth(lm.getMonth()-1);return d.getFullYear()===lm.getFullYear()&&d.getMonth()===lm.getMonth();});
    const thisExp=thisMonth.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const lastExp=lastMonth.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const thisInc=thisMonth.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    // Spending change
    if(lastExp>0){const chg=Math.round((thisExp-lastExp)/lastExp*100);if(Math.abs(chg)>10)result.push({icon:chg>0?'📈':'📉',title:chg>0?'Spending Up '+chg+'%':'Spending Down '+Math.abs(chg)+'%',body:chg>0?`You've spent ${fmt(thisExp-lastExp,currency)} more than last month. Review your categories.`:`Great! You've spent ${fmt(lastExp-thisExp,currency)} less than last month.`,color:chg>0?'var(--red)':'var(--green)',borderColor:chg>0?'#f0546a33':'#2ecc9a33'});}
    // Budget warnings
    const catMap={};thisMonth.filter(t=>t.type==='expense').forEach(t=>{const c=cats.find(x=>x.id===t.categoryId);const n=c?.name||t.category||'Other';catMap[n]=(catMap[n]||0)+t.amount;});
    Object.entries(budgets).forEach(([cat,limit])=>{if(limit>0&&catMap[cat]>limit*0.85){const pct=Math.round((catMap[cat]/limit)*100);result.push({icon:'⚠️',title:cat+' budget at '+pct+'%',body:`You've used ${fmt(catMap[cat],currency)} of your ${fmt(limit,currency)} budget.${pct>=100?' You\'ve exceeded it!':' Watch your spending here.'}`,color:'var(--amber)',borderColor:'#f5a62333'});}});
    // Savings rate
    if(thisInc>0){const rate=Math.round((thisInc-thisExp)/thisInc*100);if(rate>0)result.push({icon:'💪',title:'Saving '+rate+'% this month',body:`You're saving ${fmt(thisInc-thisExp,currency)} (${rate}%) of your income. ${rate>20?'Excellent savings rate!':rate>10?'Good, try to push toward 20%.':'Aim to save at least 10-20% of income.'}`,color:'var(--blue)',borderColor:'#4a90f533'});}
    // Top category
    const topCat=Object.entries(catMap).sort((a,b)=>b[1]-a[1])[0];
    if(topCat)result.push({icon:'🔍',title:'Top spend: '+topCat[0],body:`Your biggest expense this month is ${topCat[0]} at ${fmt(topCat[1],currency)}. ${topCat[1]>500?'Consider if this aligns with your goals.':'Looks reasonable.'}`,color:'var(--violet)',borderColor:'#b06ef733'});
    // No insights
    if(result.length===0)result.push({icon:'✨',title:'Looking good!',body:'Keep logging your transactions to get personalized insights.',color:'var(--green)',borderColor:'#2ecc9a33'});
    return result.slice(0,4);
  },[txs,budgets,cats,currency]);

  return h('div',null,
    insights.map((ins,i)=>h('div',{key:i,className:'insight-card',style:{background:ins.color+'11',borderColor:ins.borderColor}},
      h('div',{className:'insight-icon'},ins.icon),
      h('div',{className:'insight-title',style:{color:ins.color}},ins.title),
      h('div',{className:'insight-body',style:{color:'var(--text)',opacity:.85}},ins.body)
    ))
  );
}

/* ════ CALENDAR TAB ════ */
function CalendarTab({txs,cats}){
  const now=new Date();
  const[year,setYear]=useState(now.getFullYear());
  const[month,setMonth]=useState(now.getMonth());
  const[selected,setSelected]=useState(today());
  const todayStr=today();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const txMap=useMemo(()=>{const m={};txs.forEach(t=>{if(!m[t.date])m[t.date]=[];m[t.date].push(t);});return m;},[txs]);
  const prev=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const next=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const selTxs=(txMap[selected]||[]).sort((a,b)=>a.type.localeCompare(b.type));
  const selInc=selTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const selExp=selTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  return h('div',null,
    h('div',{className:'card'},
      h('div',{className:'cal-header'},
        h('button',{className:'cal-nav',onClick:prev},'‹'),
        h('div',{className:'cal-month'},MONTHS[month]+' '+year),
        h('button',{className:'cal-nav',onClick:next},'›')
      ),
      h('div',{className:'cal-grid'},
        DAYS.map(d=>h('div',{key:d,className:'cal-day-name'},d)),
        cells.map((d,i)=>{
          if(!d)return h('div',{key:'e'+i});
          const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const dayTxs=txMap[ds]||[];
          return h('div',{key:d,className:`cal-day${ds===todayStr?' today':''}${ds===selected?' selected':''}`,onClick:()=>setSelected(ds)},
            h('div',{className:'cal-day-num'},d),
            dayTxs.length>0&&h('div',{className:'cal-dots'},dayTxs.slice(0,3).map((t,j)=>h('div',{key:j,className:'cal-dot',style:{background:t.type==='income'?'var(--green)':'var(--red)'}})))
          );
        })
      )
    ),
    h('div',{className:'card'},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
        h('div',{className:'card-title',style:{marginBottom:0}},new Date(selected+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})),
        selTxs.length>0&&h('div',{style:{display:'flex',gap:8}},
          selInc>0&&h('span',{style:{color:'var(--green)',fontWeight:700,fontSize:12}},'+'+fmt(selInc)),
          selExp>0&&h('span',{style:{color:'var(--red)',fontWeight:700,fontSize:12}},'−'+fmt(selExp))
        )
      ),
      selTxs.length===0
        ?h('div',{className:'empty',style:{padding:'20px 0'}},h('div',{className:'e-icon'},'📅'),h('div',{className:'e-text'},'No transactions'))
        :selTxs.map(tx=>h(TxRow,{key:tx.id,tx,showAcc:true,cats}))
    )
  );
}

/* ════ SUMMARY TAB ════ */
function SummaryTab({txs,accounts,cats,budgets,currency}){
  const[period,setPeriod]=useState('month');
  const now=new Date();
  const filtered=useMemo(()=>txs.filter(t=>{const d=new Date(t.date);if(period==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();if(period==='year')return d.getFullYear()===now.getFullYear();return true;}),[txs,period]);
  const income=filtered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

/* ════ SETTINGS TAB ════ */
function exportCSV(txs){const h2='Date,Type,Category,Note,Amount,Currency,Account\n';const rows=txs.map(t=>`${t.date},${t.type},${t.category||''},"${t.note||''}",${t.amount},${t.currency||'USD'},"${t.accountName||''}"`).join('\n');const b=new Blob([h2+rows],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mypocket.csv';a.click();}
function exportReport(txs,accounts,currency){
  const ti=txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const te=txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const nw=accounts.reduce((s,a)=>s+a.balance,0);
  const rows=txs.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t=>`<tr><td>${t.date}</td><td>${t.type}</td><td>${t.category||''}</td><td>${t.note||''}</td><td style="color:${t.type==='income'?'#2ecc9a':'#f0546a'};font-weight:700">${t.type==='income'?'+':'-'}${t.amount} ${t.currency||'USD'}</td><td>${t.accountName||''}</td></tr>`).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MyPocket Report</title><style>body{font-family:Arial;background:#0d0f18;color:#e8ecf8;padding:32px}h1{color:#4a90f5}.s{display:flex;gap:20;margin:20px 0}.b{background:#1a1e2e;border-radius:12px;padding:14px 20px}.bl{font-size:11px;color:#5c6585;text-transform:uppercase}.bv{font-size:22px;font-weight:800;margin-top:4px}table{width:100%;border-collapse:collapse;margin-top:24px}th{background:#141720;padding:10px;text-align:left;font-size:11px;text-transform:uppercase;color:#5c6585;border-bottom:1px solid #262d42}td{padding:9px 10px;border-bottom:1px solid #1a1e2e22;font-size:12px}</style></head><body><h1>👛 MyPocket Report</h1><p style="color:#5c6585">Generated ${new Date().toLocaleDateString()}</p><div class="s"><div class="b"><div class="bl">Income</div><div class="bv" style="color:#2ecc9a">+$${ti.toLocaleString()}</div></div><div class="b"><div class="bl">Expenses</div><div class="bv" style="color:#f0546a">-$${te.toLocaleString()}</div></div><div class="b"><div class="bl">Net</div><div class="bv" style="color:#4a90f5">$${(ti-te).toLocaleString()}</div></div><div class="b"><div class="bl">Net Worth</div><div class="bv" style="color:#38c8f5">$${nw.toLocaleString()}</div></div></div><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Amount</th><th>Account</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
  const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mypocket_report.html';a.click();
}

      pin?h('div',null,

        h('div',{style:{display:'flex',gap:8}},h('button',{className:'btn-ghost',style:{flex:1},onClick:()=>setShowPinSetup(true)},'Change'),h('button',{className:'btn-ghost',style:{flex:1,color:'var(--red)',borderColor:'var(--red)33'},onClick:()=>setPin('')},'Remove'))
      ):h('div',null,h('div',{style:{fontSize:13,color:'var(--sub)',marginBottom:10}},'Protect with a 4-digit PIN'),h('button',{className:'btn-primary',onClick:()=>setShowPinSetup(true)},'Enable PIN')),
      showPinSetup&&h('div',{style:{marginTop:14}},h(PinScreen,{mode:'set',onUnlock:()=>setShowPinSetup(false),onSetPin:setPin}))
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'ℹ️ About'),
      h('div',{style:{fontSize:13,color:'var(--sub)',lineHeight:1.7}},
        h('div',null,'MyPocket v3.0'),h('div',null,'Personal Finance Manager'),h('div',{style:{marginTop:6,color:'var(--dim)',fontSize:11}},`${txs.length} transactions · ${accounts.length} accounts · ${cats.length} categories`)
      )
    )
  );
}

/* ════════ ROOT APP ════════ */
function App(){
  const[tab,setTab]=useState('home');
  const[moreTab,setMoreTab]=useState('budget');
  const[showAdd,setShowAdd]=useState(false);
  const[locked,setLocked]=useState(false);
  const[deferredPrompt,setDeferredPrompt]=useState(null);
  const[showInstall,setShowInstall]=useState(false);

  const[pin,setPin]=usePersist('mp_pin','');
  const[currency,setCurrency]=usePersist('mp_currency','USD');
  const[cats,setCats]=usePersist('mp_cats_v3',DEFAULT_CATS);
  const[accounts,setAccounts]=usePersist('mp_accounts_v3',[
    {id:'acc1',name:'Main Checking',type:'Checking',balance:4200,currency:'USD',note:'Primary account'},
    {id:'acc2',name:'Savings Account',type:'Savings',balance:12500,currency:'USD',note:'Emergency fund'},
    {id:'acc3',name:'Investment Portfolio',type:'Investment',balance:8300,currency:'USD',note:'Stocks & ETFs'},
  ]);
  const[txs,setTxs]=usePersist('mp_txs_v3',[
    {id:'t1',type:'income',categoryId:'c_salary',category:'Salary',amount:4500,note:'Monthly salary',date:'2025-03-01',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t2',type:'expense',categoryId:'c_housing',category:'Housing',amount:1200,note:'Rent',date:'2025-03-02',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t3',type:'expense',categoryId:'c_food',category:'Food',amount:85,note:'Groceries',date:'2025-03-04',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t4',type:'expense',categoryId:'c_transport',category:'Transport',amount:42,note:'Fuel',date:'2025-03-05',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t5',type:'income',categoryId:'c_investment',category:'Investment',amount:230,note:'Dividend',date:'2025-03-10',accountId:'acc3',accountName:'Investment Portfolio',currency:'USD'},
    {id:'t6',type:'expense',categoryId:'c_entertainment',category:'Entertainment',amount:55,note:'Netflix',date:'2025-03-11',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t7',type:'expense',categoryId:'c_food',category:'Food',amount:120,note:'Team lunch',date:'2025-03-13',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t8',type:'expense',categoryId:'c_shopping',category:'Shopping',amount:190,note:'New shoes',date:'2025-03-15',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t9',type:'income',categoryId:'c_freelance',category:'Freelance',amount:850,note:'Web project',date:'2025-03-18',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
    {id:'t10',type:'expense',categoryId:'c_health',category:'Health',amount:60,note:'Gym',date:'2025-03-20',accountId:'acc1',accountName:'Main Checking',currency:'USD'},
  ]);
  const[budgets,setBudgets]=usePersist('mp_budgets_v3',{Food:600,Housing:1500,Transport:200,Health:200,Entertainment:150,Shopping:300,Utilities:180,Education:100,Travel:400,Subscriptions:80,Savings:500,Other:100});
  const[reminders,setReminders]=usePersist('mp_reminders_v3',[
    {id:'r1',name:'Rent',amount:1200,dueDay:1,currency:'USD',paidThisMonth:false},
    {id:'r2',name:'Netflix',amount:15,dueDay:5,currency:'USD',paidThisMonth:false},
    {id:'r3',name:'Electricity',amount:80,dueDay:10,currency:'USD',paidThisMonth:false},
  ]);
  const[goals,setGoals]=usePersist('mp_goals_v3',[
    {id:'g1',name:'Emergency Fund',icon:'🛡️',target:10000,saved:4500,deadline:'2025-12-31',note:'6 months expenses'},
    {id:'g2',name:'Vacation',icon:'✈️',target:3000,saved:800,deadline:'2025-08-01',note:'Summer trip'},
  ]);

  useEffect(()=>{if(pin)setLocked(true);},[]);
  useEffect(()=>{
    const handler=e=>{e.preventDefault();setDeferredPrompt(e);setShowInstall(true);};
    window.addEventListener('beforeinstallprompt',handler);
    return()=>window.removeEventListener('beforeinstallprompt',handler);
  },[]);
  useEffect(()=>{
    const ls=LS.get('mp_rec_lastrun','');const ts=today();
    if(ls===ts)return;LS.set('mp_rec_lastrun',ts);
    const td=new Date(ts);
    txs.filter(t=>t.recurring).forEach(t=>{
      const orig=new Date(t.date);let next=new Date(orig);
      while(next<td){
        if(t.recFreq==='daily')next.setDate(next.getDate()+1);
        else if(t.recFreq==='weekly')next.setDate(next.getDate()+7);
        else if(t.recFreq==='monthly')next.setMonth(next.getMonth()+1);
        else if(t.recFreq==='yearly')next.setFullYear(next.getFullYear()+1);
        else break;
        if(next.toISOString().split('T')[0]===ts){setTxs(p=>[...p,{...t,id:genId(),date:ts,note:(t.note||t.category)+' (auto)'}]);break;}
      }
    });
  },[]);

  const addTxs=txList=>{
    setTxs(p=>[...txList,...p]);
    txList.forEach(tx=>{
      setAccounts(prev=>prev.map(a=>{
        if(tx.type==='transfer'){
          if(a.id===tx.accountId&&tx.transferDir==='out')return{...a,balance:a.balance-tx.amount};
          if(a.id===tx.accountId&&tx.transferDir==='in')return{...a,balance:a.balance+tx.amount};
          return a;
        }
        if(a.id!==tx.accountId)return a;
        return{...a,balance:a.balance+(tx.type==='income'?tx.amount:-tx.amount)};
      }));
    });
  };

  const installApp=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;setShowInstall(false);setDeferredPrompt(null);};

  const TAB_LABELS={home:'Home',accounts:'Accounts',records:'Records',calendar:'Calendar',budget:'Budget',goals:'Goals',ai:'AI Assistant',reminders:'Bills',settings:'Settings'};

    h('div',{className:'topbar'},

        h('div',null,h('div',{className:'topbar-title'},'MyPocket'),h('div',{className:'topbar-sub'},activeLabel))
      ),
      h('div',{className:'topbar-actions'},
        pin&&h('button',{className:'topbar-btn ghost',onClick:()=>setLocked(true)},'🔐'),
        h('button',{className:'topbar-btn',onClick:()=>setShowAdd(true)},'+')
      )
    ),
    h('div',{className:'page',key:tab==='more'?'more_'+moreTab:tab},
      showInstall&&h('div',{className:'install-banner'},
        h('div',{style:{fontSize:20,flexShrink:0}},'📱'),
        h('div',{style:{flex:1}},h('div',{style:{fontSize:12,fontWeight:700}}),'Install MyPocket',h('div',{style:{fontSize:11,color:'var(--sub)'}},'Add to home screen')),
        h('button',{style:{background:'var(--blue)',border:'none',color:'#fff',borderRadius:8,padding:'7px 12px',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'},onClick:installApp},'Install'),
        h('button',{style:{background:'none',border:'none',color:'var(--sub)',cursor:'pointer',fontSize:16},onClick:()=>setShowInstall(false)},'✕')
      ),
      tab==='home'&&h(SummaryTab,{txs,accounts,cats,budgets,currency}),
      tab==='accounts'&&h(AccountsTab,{accounts,setAccounts,txs,cats,currency}),
      tab==='records'&&h(RecordsTab,{txs,setTxs,accounts,cats,currency}),
      tab==='calendar'&&h(CalendarTab,{txs,cats}),
      tab==='more'&&h('div',null,
        h('div',{className:'pill-tabs',style:{overflowX:'auto'}},MORE_TABS.map(t=>h('button',{key:t.id,className:`pill-tab${moreTab===t.id?' active':''}`,onClick:()=>setMoreTab(t.id),style:{whiteSpace:'nowrap',padding:'8px 10px',fontSize:11}},t.icon+' '+t.label))),
        moreTab==='budget'&&h(BudgetTab,{txs,budgets,setBudgets,cats,currency}),
        moreTab==='goals'&&h(GoalsTab,{goals,setGoals,accounts,currency}),
        moreTab==='ai'&&h(AIAssistant,{txs,accounts,cats,budgets,currency}),
        moreTab==='reminders'&&h(RemindersTab,{reminders,setReminders}),
        moreTab==='settings'&&h(SettingsTab,{pin,setPin,currency,setCurrency,txs,accounts,cats,setCats,setAccounts})
      )
    ),
    h('div',{className:'bottomnav'},NAV.map(n=>h('button',{key:n.id,className:`nav-btn${tab===n.id?' active':''}`,onClick:()=>setTab(n.id)},h('span',{className:'n-icon'},n.icon),h('span',{className:'n-label'},n.label),tab===n.id&&h('div',{className:'pip'})))),
    showAdd&&h(AddEntrySheet,{accounts,cats,onSave:addTxs,onClose:()=>setShowAdd(false),defaultCurrency:currency})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
