<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#0d0f18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ePocket"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="/manifest.json"/>
<title>ePocket</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0f18;--surf:#141720;--card:#1a1e2e;--raised:#1f2438;
  --border:#262d42;--muted:#2e3650;--text:#e8ecf8;--sub:#5c6585;--dim:#3a4260;
  --green:#2ecc9a;--red:#f0546a;--blue:#4a90f5;--indigo:#7c6ef7;
  --amber:#f5a623;--sky:#38c8f5;--violet:#b06ef7;--rose:#fb7185;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
.pin-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;max-width:480px;margin:0 auto}
.pin-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 8px 32px #4a90f540}
.pin-title{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px}
.pin-sub{font-size:13px;color:var(--sub);margin-bottom:32px;text-align:center}
.pin-dots{display:flex;gap:16px;margin-bottom:32px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue);transform:scale(1.1)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px}
.pin-key{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;font-size:22px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:all .15s;color:var(--text)}
.pin-key:active{background:var(--raised);transform:scale(.94)}
.pin-key.del{font-size:18px;color:var(--sub)}
.pin-key.empty{background:transparent;border-color:transparent;cursor:default}
.pin-err{color:var(--red);font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(80px + var(--safe-bot));padding-top:calc(12px + var(--safe-top));-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}
.topbar{background:var(--surf);border-bottom:1px solid var(--border);padding:0 16px;height:calc(54px + var(--safe-top));padding-top:var(--safe-top);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;flex-shrink:0}
.topbar-logo{display:flex;align-items:center;gap:8px;min-width:0}
.topbar-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px #4a90f540;flex-shrink:0}
.topbar-title{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:10px;color:var(--sub);margin-top:1px}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.topbar-btn{width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;background:linear-gradient(135deg,#4a90f5,#7c6ef7);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #4a90f540;transition:transform .15s}
.topbar-btn:active{transform:scale(.92)}
.topbar-btn.ghost{background:var(--card);border:1px solid var(--border);font-size:15px;box-shadow:none;color:var(--sub)}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:var(--safe-bot)}
.nav-btn{flex:1;padding:9px 0 5px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:var(--dim);transition:color .15s}
.nav-btn.active{color:var(--blue)}
.nav-btn .n-icon{font-size:19px;line-height:1}
.nav-btn .n-label{font-size:9px;font-weight:700;letter-spacing:.04em}
.nav-btn .pip{width:16px;height:2px;border-radius:1px;background:var(--blue);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card-title{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.sec-label{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:block}
.input{width:100%;background:var(--raised);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:10px 13px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;appearance:none;-webkit-appearance:none}
.input:focus{border-color:var(--blue)}
.input::placeholder{color:var(--sub)}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;padding:13px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:'Sora',sans-serif;box-shadow:0 4px 20px #4a90f530;transition:transform .15s,opacity .15s}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-primary.green{background:linear-gradient(135deg,#2ecc9a,#1aaa7e)}
.btn-primary.red{background:linear-gradient(135deg,#f0546a,#d03050)}
.btn-primary.amber{background:linear-gradient(135deg,#f5a623,#d4881a)}
.btn-primary.violet{background:linear-gradient(135deg,#7c6ef7,#5a4ed4)}
.btn-primary.teal{background:linear-gradient(135deg,#2ecc9a,#4a90f5)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--sub);border-radius:9px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ghost:active{background:var(--muted)}
.btn-back{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px;font-weight:600;padding:0;margin-bottom:16px;font-family:inherit;display:flex;align-items:center;gap:5px}
.pill-tabs{display:flex;background:var(--card);border-radius:11px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.pill-tab{flex:1;padding:7px 4px;border:none;cursor:pointer;background:transparent;color:var(--sub);font-weight:700;font-size:11px;font-family:inherit;transition:all .15s;white-space:nowrap}
.pill-tab.active{background:var(--blue);color:#fff}
.type-toggle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.type-btn{padding:11px 0;border-radius:12px;border:1px solid var(--border);cursor:pointer;font-weight:800;font-size:15px;font-family:'Sora',sans-serif;transition:all .2s;background:var(--card);color:var(--sub)}
.type-btn span{display:block;font-size:10px;font-weight:700;margin-top:2px}
.type-btn.income.active{background:#2ecc9a22;color:var(--green);border-color:#2ecc9a55}
.type-btn.expense.active{background:#f0546a22;color:var(--red);border-color:#f0546a55}
.type-btn.transfer.active{background:#4a90f522;color:var(--blue);border-color:#4a90f555}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.cat-btn{padding:8px 3px;border-radius:10px;border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s;background:var(--card);font-family:inherit}
.cat-btn .cat-icon{font-size:17px}
.cat-btn .cat-name{font-size:9px;font-weight:700;color:var(--sub);text-align:center;line-height:1.2}
.tx-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #26334214}
.tx-row:last-child{border-bottom:none}
.tx-icon{border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-main{flex:1;min-width:0}
.tx-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:10px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-del{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:3px 5px;border-radius:5px;flex-shrink:0}
.hero{background:linear-gradient(145deg,#162040,#0f1628);border:1px solid #2a4080aa;border-radius:20px;padding:20px;margin-bottom:12px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#4a90f518,transparent 70%);top:-50px;right:-30px;pointer-events:none}
.hero-label{font-size:10px;font-weight:700;color:#7090d0;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.hero-amount{font-family:'Sora',sans-serif;font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-row{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap}
.hero-stat-lbl{font-size:9px;font-weight:700;color:#7090d0;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.hero-stat-val{font-size:14px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}
.hero-divider{width:1px;background:#2a4080}
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
.stat-lbl{font-size:9px;font-weight:700;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.stat-val{font-size:17px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}
.acc-card{border-radius:16px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.acc-card:active{transform:scale(.98)}
.acc-card-name{font-size:14px;font-weight:800;font-family:'Sora',sans-serif;margin-bottom:2px}
.acc-card-bal{font-size:22px;font-weight:800;font-family:'Sora',sans-serif;font-variant-numeric:tabular-nums}
.acc-card-sub{font-size:10px;opacity:.6;margin-top:3px}
.acc-card-glow{position:absolute;width:90px;height:90px;border-radius:50%;opacity:.18;top:-18px;right:-12px}
.progress-track{height:5px;background:var(--muted);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
.amount-hero{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.modal-bg{position:fixed;inset:0;background:#000c;z-index:400;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
.modal-sheet{background:var(--surf);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-bot));width:100%;max-height:93vh;overflow-y:auto;animation:slideUp .25s ease}
.modal-sheet::-webkit-scrollbar{display:none}
.modal-handle{width:34px;height:4px;background:var(--muted);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:800;font-family:'Sora',sans-serif;margin-bottom:16px}
/* Space cards */
.space-card{border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;border:1px solid}
.space-card:active{transform:scale(.98)}
/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Sora',sans-serif;flex-shrink:0}
.avatar-stack{display:flex}
.avatar-stack .avatar{margin-left:-8px;border:2px solid var(--surf)}
.avatar-stack .avatar:first-child{margin-left:0}
/* Member row */
.member-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)22}
.member-row:last-child{border-bottom:none}
.manage-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)22}
.manage-row:last-child{border-bottom:none}
.manage-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.manage-info{flex:1;min-width:0}
.manage-name{font-size:13px;font-weight:700}
.manage-sub{font-size:10px;color:var(--sub);margin-top:1px}
.manage-actions{display:flex;gap:5px;flex-shrink:0}
.role-badge{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
/* Comments */
.comment-bubble{background:var(--raised);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.comment-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comment-author{font-size:11px;font-weight:700}
.comment-time{font-size:10px;color:var(--sub)}
.comment-text{font-size:12px;line-height:1.5;color:var(--text)}
/* Chat */
.chat-messages{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;min-height:160px;max-height:45vh;overflow-y:auto}
.chat-messages::-webkit-scrollbar{display:none}
.chat-bubble{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55}
.chat-bubble.user{background:linear-gradient(135deg,#4a90f5,#7c6ef7);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.ai{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.chat-input-row{display:flex;gap:8px}
.chat-input{flex:1;background:var(--raised);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:10px 13px;font-size:13px;outline:none;font-family:inherit}
.chat-input:focus{border-color:var(--blue)}
.chat-send{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#4a90f5,#7c6ef7);border:none;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.goal-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.insight-card{border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid}
.ring-wrap{position:relative;display:inline-block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.searchbar{position:relative;margin-bottom:10px}
.searchbar .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px;pointer-events:none}
.searchbar input{padding-left:32px}
.date-hdr{display:flex;justify-content:space-between;align-items:center;padding:3px 2px;margin-bottom:3px}
.date-hdr-left{font-size:10px;font-weight:700;color:var(--sub)}
.date-hdr-right{display:flex;gap:6px;font-size:10px;font-weight:700}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:7px}
.cal-month{font-family:'Sora',sans-serif;font-size:15px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-name{font-size:9px;font-weight:700;color:var(--sub);text-align:center;padding:3px 0}
.cal-day{min-height:38px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 1px 2px;cursor:pointer;transition:background .15s}
.cal-day.today .cal-day-num{background:var(--blue);color:#fff;border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.cal-day.selected{background:var(--raised);border:1px solid #4a90f544}
.cal-day.other-month .cal-day-num{color:var(--dim)}
.cal-day-num{font-size:11px;font-weight:600;line-height:1;margin-bottom:2px}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal-dot{width:3px;height:3px;border-radius:50%}
.receipt-placeholder{width:100%;height:68px;border-radius:10px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;margin-bottom:8px;color:var(--sub);font-size:12px;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px;max-height:150px;overflow-y:auto}
.emoji-btn{padding:7px 3px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:19px;transition:background .12s}
.emoji-btn:active,.emoji-btn.selected{background:var(--raised)}
.emoji-btn.selected{outline:2px solid var(--blue)}
.color-grid{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .15s;border:2px solid transparent}
.color-swatch.selected{transform:scale(1.2);border-color:var(--text)}
.empty{text-align:center;padding:36px 0;color:var(--sub)}
.empty .e-icon{font-size:34px;margin-bottom:8px}
.empty .e-text{font-size:13px}
.err{color:var(--red);font-size:12px;margin-bottom:8px}
.divider{height:1px;background:var(--border);margin:12px 0}
.rec-badge{background:#7c6ef722;border:1px solid #7c6ef744;border-radius:18px;padding:1px 6px;font-size:9px;font-weight:700;color:var(--indigo)}
.transfer-badge{background:#4a90f522;border:1px solid #4a90f544;border-radius:18px;padding:1px 6px;font-size:9px;font-weight:700;color:var(--blue)}
.split-badge{background:#f5a62322;border:1px solid #f5a62344;border-radius:18px;padding:1px 6px;font-size:9px;font-weight:700;color:var(--amber)}
/* ── NEW FEATURE STYLES v5.0 ── */
.score-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.score-ring svg{transform:rotate(-90deg)}
.score-number{position:absolute;font-family:'Sora',sans-serif;font-size:28px;font-weight:800;line-height:1}
.score-label{font-size:9px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin-top:2px;text-align:center}
.insight-auto{border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.insight-auto-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.insight-auto-body{flex:1;min-width:0}
.insight-auto-title{font-size:12px;font-weight:700;margin-bottom:2px}
.insight-auto-text{font-size:11px;color:var(--sub);line-height:1.5}
.nw-bar{height:8px;border-radius:4px;margin:4px 0;transition:width .6s ease}
.nw-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.nw-label{font-size:11px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-val{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #26334214}
.sub-row:last-child{border-bottom:none}
.sub-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.health-factor{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.health-factor-label{font-size:12px;font-weight:600;flex:1}
.health-factor-score{font-size:11px;font-weight:700;white-space:nowrap}
.receipt-scan-area{border:2px dashed var(--border);border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px}
.receipt-scan-area:hover{border-color:var(--blue);background:#4a90f508}
.receipt-scan-area.scanning{border-color:var(--blue);animation:pulse 1.2s ease infinite}
.import-zone{border:2px dashed var(--border);border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.import-zone:hover{border-color:var(--green);background:#2ecc9a08}
.tag-pill{display:inline-flex;align-items:center;gap:4px;background:var(--raised);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;margin:2px}

const fmt=(n,cur='USD',dec=0)=>{if(isNaN(n))return'$0';try{return new Intl.NumberFormat('en-US',{style:'currency',currency:cur,maximumFractionDigits:dec}).format(n);}catch{return'$'+Number(n).toFixed(dec);}};

  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};
function usePersist(key,def){
  const[val,setVal]=useState(()=>LS.get(key,def));
  const set=useCallback(v=>{setVal(prev=>{const next=typeof v==='function'?v(prev):v;LS.set(key,next);return next;});},[key]);
  return[val,set];
}
function useFirebase(){

/* ── PIN ── */
function PinScreen({mode,savedPin,onUnlock,onSetPin}){
  const[input,setInput]=useState('');const[confirm,setConfirm]=useState('');
  const[step,setStep]=useState(mode==='set'?'enter':'verify');
  const[err,setErr]=useState('');const[shake,setShake]=useState(false);
  const doShake=()=>{setShake(true);setTimeout(()=>setShake(false),400);};
  const press=key=>{
    if(key==='del'){step==='confirm'?setConfirm(p=>p.slice(0,-1)):setInput(p=>p.slice(0,-1));return;}
    const nv=(step==='confirm'?confirm:input)+key;
    step==='confirm'?setConfirm(nv):setInput(nv);
    if(nv.length===4){
      if(step==='enter'&&mode==='set'){setStep('confirm');setErr('');}
      else if(step==='confirm'){if(nv===input){onSetPin(input);onUnlock();}else{setErr('PINs do not match');setConfirm('');doShake();}}
      else if(step==='verify'){if(nv===savedPin){onUnlock();}else{setErr('Incorrect PIN');setInput('');doShake();}}
    }
  };
  const cur=step==='confirm'?confirm:input;
  return h('div',{className:'pin-screen'},
    h('div',{className:'pin-logo'},'👛'),
    h('div',{className:'pin-title'},'ePocket'),
    h('div',{className:'pin-sub'},mode==='set'?(step==='enter'?'Create a 4-digit PIN':'Confirm your PIN'):'Enter your PIN'),
    h('div',{className:`pin-dots${shake?' shake':''}`,key:step},[0,1,2,3].map(i=>h('div',{key:i,className:`pin-dot${cur.length>i?' filled':''}${err&&!cur.length?' error':''}`}))),
    h('div',{className:'pin-pad'},['1','2','3','4','5','6','7','8','9','','0','del'].map((k,i)=>
      k===''?h('div',{key:i,className:'pin-key empty'}):h('button',{key:i,className:`pin-key${k==='del'?' del':''}`,onClick:()=>press(k)},k==='del'?'⌫':k)
    )),
    h('div',{className:'pin-err'},err)
  );
}

      onSave([{id:genId(),type,categoryId:catId,category:cat?.name||'',amount:+amt,note:note.trim(),date,accountId:accId,accountName:acc?.name||'',currency:cur,receipt,splitWith,splitAmount:splitAmt}]);

function SpaceSwitcherModal({spaces,activeSpaceId,myProfile,onSwitch,onClose,onCreateSpace,onJoinSpace}){
  const[view,setView]=useState('list');
  const[code,setCode]=useState('');const[form,setForm]=useState({name:'',emoji:'👨‍👩‍👧‍👦',color:'#4a90f5',description:''});
  const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const fbReady=useFirebase();

  const create=async()=>{
    if(!form.name.trim())return setErr('Space name required.');
    if(!fbReady)return setErr('Connecting to server…');
    setLoading(true);setErr('');
    const id=genId();const spaceCode=genCode();
    const space={id,name:form.name.trim(),emoji:form.emoji,color:form.color,description:form.description,code:spaceCode,createdBy:myProfile.id,createdAt:new Date().toISOString(),members:{[myProfile.id]:{...myProfile,role:'admin',joinedAt:new Date().toISOString()}}};
    try{
      await window.__fb.setDoc(window.__fb.doc(window.__db,'spaces',id),space);
      onCreateSpace(space);onClose();
    }catch(e){setErr('Error: '+e.message);}
    setLoading(false);
  };

  const join=async()=>{
    if(!code.trim())return setErr('Enter a join code.');
    if(!fbReady)return setErr('Connecting to server…');
    setLoading(true);setErr('');
    try{
      const q=window.__fb.query(window.__fb.collection(window.__db,'spaces'),window.__fb.where('code','==',code.trim().toUpperCase()));
      const snap=await window.__fb.getDocs(q);
      if(snap.empty){setErr('Space not found. Check the code.');setLoading(false);return;}
      const spaceDoc=snap.docs[0];const space={id:spaceDoc.id,...spaceDoc.data()};
      if(space.members?.[myProfile.id]){setErr('You are already in this space!');setLoading(false);return;}
      const members={...space.members,[myProfile.id]:{...myProfile,role:'member',joinedAt:new Date().toISOString()}};
      await window.__fb.updateDoc(window.__fb.doc(window.__db,'spaces',space.id),{members});
      onJoinSpace({...space,members});onClose();

    setLoading(false);

  if(view==='create')return h('div',{className:'modal-bg',onClick:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'modal-sheet'},
      h('div',{className:'modal-handle'}),
      h('button',{className:'btn-back',onClick:()=>{setView('list');setErr('');}},'← Back'),
      h('div',{className:'modal-title'},'Create a Shared Space'),
      h('div',{className:'field'},h('label',null,'Space Name'),h('input',{className:'input',type:'text',placeholder:'Family Budget, Trip Fund, Team…',value:form.name,onChange:e=>setForm(p=>({...p,name:e.target.value})),autoFocus:true})),
      h('div',{className:'field'},h('label',null,'Choose Emoji'),h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},SPACE_EMOJIS.map(em=>h('button',{key:em,style:{fontSize:22,padding:6,borderRadius:8,border:`2px solid ${form.emoji===em?'var(--blue)':'transparent'}`,background:form.emoji===em?'#4a90f522':'transparent',cursor:'pointer'},onClick:()=>setForm(p=>({...p,emoji:em}))},em)))),
      h('div',{className:'field'},h('label',null,'Color'),h('div',{className:'color-grid'},SPACE_COLORS.map(c=>h('div',{key:c,className:`color-swatch${form.color===c?' selected':''}`,style:{background:c},onClick:()=>setForm(p=>({...p,color:c}))})))),
      h('div',{className:'field'},h('label',null,'Description (optional)'),h('input',{className:'input',type:'text',placeholder:'What is this space for?',value:form.description,onChange:e=>setForm(p=>({...p,description:e.target.value}))})),
      err&&h('div',{className:'err'},err),
      h('button',{className:'btn-primary teal',onClick:create,disabled:loading},loading?'Creating…':'✨ Create Space')
    )
  );

  if(view==='join')return h('div',{className:'modal-bg',onClick:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'modal-sheet'},
      h('div',{className:'modal-handle'}),
      h('button',{className:'btn-back',onClick:()=>{setView('list');setErr('');}},'← Back'),
      h('div',{className:'modal-title'},'Join a Space'),
      h('div',{style:{textAlign:'center',fontSize:48,padding:'8px 0'}},'🔗'),
      h('div',{style:{fontSize:13,color:'var(--sub)',textAlign:'center',marginBottom:20,lineHeight:1.6}},'Ask the space admin for their 6-character invite code'),
      h('div',{className:'field'},h('label',null,'Invite Code'),h('input',{className:'input',type:'text',placeholder:'ABC123',value:code,onChange:e=>setCode(e.target.value.toUpperCase()),style:{letterSpacing:'.15em',fontSize:22,fontWeight:800,textAlign:'center',fontFamily:'monospace'}})),
      err&&h('div',{className:'err',style:{textAlign:'center'}},err),
      h('button',{className:'btn-primary violet',onClick:join,disabled:loading},loading?'Joining…':'🔗 Join Space')
    )
  );

  return h('div',{className:'modal-bg',onClick:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'modal-sheet'},

        activeSpaceId===null&&h('div',{style:{color:'var(--green)',fontSize:12,fontWeight:700}},'✓')
      ),

      spaces.map(sp=>h('div',{key:sp.id,className:'manage-row',style:{cursor:'pointer'},onClick:()=>{onSwitch(sp.id);onClose();}},
        h('div',{className:'manage-icon',style:{background:sp.color+'22',border:`1px solid ${sp.color}44`,fontSize:18}},sp.emoji),
        h('div',{className:'manage-info'},

      h('div',{style:{display:'flex',gap:8}},

        h('button',{className:'btn-primary violet',style:{flex:1},onClick:()=>{setErr('');setView('join');}},'🔗 Join')

/* ════════════════════════════
     SPACE HOME (Firebase-powered)
════════════════════════════ */
function SpaceHome({space,myProfile,cats,currency}){
  const[txs,setTxs]=useState([]);
  const[accounts,setAccounts]=useState([]);
  const[goals,setGoals]=useState([]);
  const[budgets,setBudgets]=usePersist('mp_sp_bud_'+space.id,{});
  const[showAddTx,setShowAddTx]=useState(false);
  const[showAddAcc,setShowAddAcc]=useState(false);
  const[commentTx,setCommentTx]=useState(null);
  const[showMembers,setShowMembers]=useState(false);
  const[activeTab,setActiveTab]=useState('overview');
  const fbReady=useFirebase();
  const members=Object.values(space.members||{});
  const isAdmin=(space.members||{})[myProfile.id]?.role==='admin';

  useEffect(()=>{
    if(!fbReady)return;
    const{collection:col,query:q,orderBy:ob,onSnapshot:ons}=window.__fb;
    const u1=ons(q(col(window.__db,'spaces',space.id,'transactions'),ob('date','desc')),s=>setTxs(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2=ons(col(window.__db,'spaces',space.id,'accounts'),s=>setAccounts(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u3=ons(col(window.__db,'spaces',space.id,'goals'),s=>setGoals(s.docs.map(d=>({id:d.id,...d.data()}))));
    return()=>{u1();u2();u3();};
  },[fbReady,space.id]);

  const addTx=async(txList)=>{
    if(!fbReady)return;
    for(const tx of txList){
      const{addDoc:add,collection:col,doc:fd,updateDoc:upd}=window.__fb;
      await add(col(window.__db,'spaces',space.id,'transactions'),{...tx,addedBy:myProfile.id,addedByName:myProfile.name,addedByEmoji:myProfile.emoji,createdAt:new Date().toISOString()});
      const acc=accounts.find(a=>a.id===tx.accountId);
      if(acc){
        const delta=tx.type==='transfer'?(tx.transferDir==='out'?-tx.amount:tx.amount):tx.type==='income'?tx.amount:-tx.amount;
        await upd(fd(window.__db,'spaces',space.id,'accounts',acc.id),{balance:acc.balance+delta});
      }
    }
  };
  const delTx=async id=>{if(!isAdmin)return;await window.__fb.deleteDoc(window.__fb.doc(window.__db,'spaces',space.id,'transactions',id));};
  const addAccount=async acc=>{if(!fbReady)return;await window.__fb.addDoc(window.__fb.collection(window.__db,'spaces',space.id,'accounts'),{...acc,createdBy:myProfile.id});setShowAddAcc(false);};
  const saveGoal=async g=>{if(!fbReady)return;await window.__fb.setDoc(window.__fb.doc(window.__db,'spaces',space.id,'goals',g.id),g);};

  const totalBal=accounts.reduce((s,a)=>s+a.balance,0);
  const now=new Date();
  const mTxs=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
  const mInc=mTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const mExp=mTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const memberSpend=useMemo(()=>{const m={};txs.filter(t=>t.type==='expense').forEach(t=>{m[t.addedBy]=(m[t.addedBy]||0)+t.amount;});return m;},[txs]);
  const grouped=useMemo(()=>{const m={};txs.slice(0,60).forEach(t=>{(m[t.date]||(m[t.date]=[])).push(t);});return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));},[txs]);

  const TABS=[['overview','Overview'],['transactions','Transactions'],['accounts','Accounts'],['goals','Goals'],['budget','Budget']];

  return h('div',null,
    // Hero
    h('div',{className:'hero pop',style:{background:`linear-gradient(145deg,${space.color}18,#0f1628)`,borderColor:space.color+'44'}},
      h('div',{style:{fontSize:36,marginBottom:4}},space.emoji),
      h('div',{className:'hero-label'},space.name),
      h('div',{className:'hero-amount',style:{color:space.color}},fmt(totalBal,currency)),
      space.description&&h('div',{style:{fontSize:11,color:'var(--sub)',marginBottom:8}},space.description),
      h('div',{className:'hero-row'},
        h('div',null,h('div',{className:'hero-stat-lbl'},'In'),h('div',{className:'hero-stat-val',style:{color:'var(--green)'}},'+'+fmt(mInc,currency))),
        h('div',{className:'hero-divider'}),
        h('div',null,h('div',{className:'hero-stat-lbl'},'Out'),h('div',{className:'hero-stat-val',style:{color:'var(--red)'}},'−'+fmt(mExp,currency))),
        h('div',{className:'hero-divider'}),
        h('div',{style:{cursor:'pointer'},onClick:()=>setShowMembers(true)},
          h('div',{className:'hero-stat-lbl'},'Members'),
          h('div',{style:{display:'flex',justifyContent:'center',marginTop:3}},
            h('div',{className:'avatar-stack'},members.slice(0,5).map(m=>h(Avatar,{key:m.id,name:m.name,color:space.color,size:'sm',emoji:m.emoji})))
          )
        )
      ),
      h('div',{style:{marginTop:8,fontSize:10,color:space.color,opacity:.6,fontFamily:'monospace',letterSpacing:'.12em'}},'Code: '+space.code+(isAdmin?' · tap members to share':''))
    ),
    // Sub tabs
    h('div',{className:'pill-tabs',style:{overflowX:'auto'}},TABS.map(([v,l])=>h('button',{key:v,className:`pill-tab${activeTab===v?' active':''}`,onClick:()=>setActiveTab(v),style:{fontSize:10,padding:'7px 8px'}},l))),

    // Overview
    activeTab==='overview'&&h('div',null,
      h('div',{className:'card'},
        h('div',{className:'card-title'},'👥 Member Spending'),
        members.map(m=>{
          const sp=memberSpend[m.id]||0;const mx=Math.max(...Object.values(memberSpend),1);
          return h('div',{key:m.id,style:{display:'flex',alignItems:'center',gap:10,marginBottom:12}},
            h(Avatar,{name:m.name,color:space.color,emoji:m.emoji}),
            h('div',{style:{flex:1}},
              h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
                h('span',{style:{fontSize:12,fontWeight:700}},m.name+(m.id===myProfile.id?' (you)':''),
                  h('span',{className:'role-badge',style:{marginLeft:6,background:m.role==='admin'?'#f5a62322':'#4a90f522',color:m.role==='admin'?'var(--amber)':'var(--blue)',border:'1px solid',borderColor:m.role==='admin'?'#f5a62344':'#4a90f544'}},m.role)
                ),
                h('span',{style:{fontSize:11,color:'var(--sub)'}},fmt(sp,currency))
              ),
              h('div',{className:'progress-track'},h('div',{className:'progress-fill',style:{width:Math.round(sp/mx*100)+'%',background:space.color}}))
            )
          );
        })
      ),
      h('div',{className:'card'},
        h('div',{className:'card-title'},'🕐 Recent'),
        txs.length===0?h('div',{className:'empty',style:{padding:'16px 0'}},h('div',{className:'e-icon'},'💸'),h('div',{className:'e-text'},'No transactions yet')):
        txs.slice(0,8).map(tx=>h(TxRow,{key:tx.id,tx,cats,members,currency,showAcc:true,onComment:setCommentTx,onDelete:isAdmin?delTx:null}))

    // Transactions
    activeTab==='transactions'&&h('div',null,
      grouped.length===0?h('div',{className:'empty'},h('div',{className:'e-icon'},'📋'),h('div',{className:'e-text'},'No transactions')):

    // Accounts
    activeTab==='accounts'&&h('div',null,
      accounts.length===0&&h('div',{className:'empty'},h('div',{className:'e-icon'},'🏦'),h('div',{className:'e-text'},'No shared accounts yet')),

      isAdmin&&h('button',{className:'btn-primary teal',style:{marginTop:8},onClick:()=>setShowAddAcc(true)},'+ Add Shared Account')
    ),

    // Goals
    activeTab==='goals'&&h(SpaceGoals,{goals,onSave:saveGoal,currency,isAdmin,color:space.color}),

    // Budget
    activeTab==='budget'&&h(SpaceBudget,{txs,budgets,setBudgets,cats,currency,isAdmin}),

    // FAB
    h('div',{style:{position:'sticky',bottom:86,display:'flex',justifyContent:'flex-end',pointerEvents:'none',marginTop:4}},

    const totalAssets=accounts.filter(a=>a.type!=='Loan'&&a.type!=='Credit Card').reduce((s,a)=>s+a.balance,0)+extraAssets.reduce((s,a)=>s+a.value,0);
    const totalLiabilities=accounts.filter(a=>a.type==='Loan'||a.type==='Credit Card').reduce((s,a)=>s+Math.abs(a.balance),0);

    setNetWorthHistory(p=>{const filtered=p.filter(x=>x.month!==key);return[...filtered,{month:key,nw,assets:totalAssets,liabilities:totalLiabilities}].sort((a,b)=>a.month.localeCompare(b.month)).slice(-12);});
    return nw;
  };

  const assetAccounts=accounts.filter(a=>a.type!=='Loan'&&a.type!=='Credit Card');

  const totalAssets=totalBankAssets+totalExtraAssets;
  const totalLiabilities=liabilityAccounts.reduce((s,a)=>s+Math.abs(a.balance),0);
  const netWorth=totalAssets-totalLiabilities;

  };
  const delAsset=id=>setExtraAssets(p=>p.filter(a=>a.id!==id));

  return h('div',null,
    // Net Worth Hero

      h('div',{className:'hero-label'},'Total Net Worth'),

      h('div',{className:'hero-row'},

        h('div',{className:'hero-divider'}),
        h('div',null,h('div',{className:'hero-stat-lbl'},'Liabilities'),h('div',{className:'hero-stat-val',style:{color:'var(--red)'}},fmtK(totalLiabilities))),
        h('div',{className:'hero-divider'}),
        h('div',null,h('div',{className:'hero-stat-lbl'},'Ratio'),h('div',{className:'hero-stat-val',style:{color:'var(--amber)'}},totalAssets>0?Math.round(totalLiabilities/totalAssets*100)+'%':'—'))
      )
    ),
    // Net Worth Chart
    netWorthHistory.length>1&&h('div',{className:'card'},
      h('div',{className:'card-title'},'📈 Net Worth Over Time'),
      h('div',{style:{display:'flex',alignItems:'flex-end',gap:3,height:60,padding:'4px 0'}},
        netWorthHistory.map((pt,i)=>{
          const pct=Math.max(5,Math.round((pt.nw-minNW)/range*100));
          return h('div',{key:pt.month,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}},
            h('div',{className:'chart-bar',style:{width:'100%',height:pct*0.6+'px',background:pt.nw>=0?'var(--green)':'var(--red)',opacity:.8+i/(netWorthHistory.length*5)}}),
            h('div',{style:{fontSize:8,color:'var(--sub)',textAlign:'center'}},pt.month.slice(5))
          );
        })
      )
    ),
    // Snapshot button
    h('button',{className:'btn-primary green',style:{marginBottom:12,fontSize:12},onClick:()=>{const nw=snapshotNW();alert(`✅ Snapshot saved! Net Worth: ${fmt(nw,currency)}`);}},'📸 Snapshot Net Worth'),
    // Assets

/* ════════════════════════════
   FEATURE 4: AUTOMATIC INSIGHTS
════════════════════════════ */
function AutoInsights({txs,accounts,cats,budgets,currency,mInc,mExp}){
  const now=new Date();
  const insights=useMemo(()=>{
    const r=[];
    const thisMonth=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
    const lastMonthDate=new Date(now.getFullYear(),now.getMonth()-1,1);
    const lastMonth=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===lastMonthDate.getFullYear()&&d.getMonth()===lastMonthDate.getMonth();});

    // Category spending changes
    const catThis={};const catLast={};
    thisMonth.filter(t=>t.type==='expense').forEach(t=>{const c=cats.find(x=>x.id===t.categoryId);const n=c?.name||'Other';catThis[n]=(catThis[n]||0)+t.amount;});
    lastMonth.filter(t=>t.type==='expense').forEach(t=>{const c=cats.find(x=>x.id===t.categoryId);const n=c?.name||'Other';catLast[n]=(catLast[n]||0)+t.amount;});
    Object.entries(catThis).forEach(([cat,amt])=>{
      if(catLast[cat]&&catLast[cat]>10){
        const chg=Math.round((amt-catLast[cat])/catLast[cat]*100);
        if(chg>=15)r.push({icon:'⚠️',color:'var(--red)',bc:'#f0546a22',bc2:'#f0546a55',title:`${cat} up ${chg}%`,text:`Spent ${fmt(amt,currency)} this month vs ${fmt(catLast[cat],currency)} last month.`});
        else if(chg<=-15)r.push({icon:'✅',color:'var(--green)',bc:'#2ecc9a22',bc2:'#2ecc9a55',title:`${cat} down ${Math.abs(chg)}%`,text:`Great! ${fmt(catLast[cat]-amt,currency)} less than last month.`});
      }
    });

    // Budget pace check (40% budget in first 7 days)
    const dayOfMonth=now.getDate();
    if(dayOfMonth<=10&&mInc>0){
      const paceRatio=mExp/mInc;
      if(paceRatio>0.4)r.push({icon:'⚠️',color:'var(--amber)',bc:'#f5a62322',bc2:'#f5a62355',title:`Spent ${Math.round(paceRatio*100)}% of income in ${dayOfMonth} days`,text:`At this pace you'll spend ${fmt(mExp/dayOfMonth*30,currency)} this month. Watch out!`});
    }

    // Savings rate
    if(mInc>0){
      const rate=Math.round((mInc-mExp)/mInc*100);
      if(rate>=20)r.push({icon:'✅',color:'var(--green)',bc:'#2ecc9a22',bc2:'#2ecc9a55',title:`Savings rate: ${rate}%`,text:`You're saving ${fmt(mInc-mExp,currency)} this month. ${rate>=30?'Outstanding!':'Keep it up!'}`});
      else if(rate<5&&rate>=0)r.push({icon:'💡',color:'var(--blue)',bc:'#4a90f522',bc2:'#4a90f555',title:`Low savings: ${rate}%`,text:`Try to save at least 20% of income. Cut back on discretionary spending.`});
      else if(rate<0)r.push({icon:'🚨',color:'var(--red)',bc:'#f0546a22',bc2:'#f0546a55',title:`Spending exceeds income!`,text:`You're over-spending by ${fmt(mExp-mInc,currency)} this month.`});
    }

    // Budget overspend
    const budgetAlerts=Object.entries(budgets).filter(([cat,limit])=>{
      const sp=catThis[cat]||0;return sp>limit*0.9&&limit>0;
    }).map(([cat,limit])=>{
      const sp=catThis[cat]||0;const over=sp>limit;
      return{icon:over?'🚨':'⚠️',color:over?'var(--red)':'var(--amber)',bc:over?'#f0546a22':'#f5a62322',bc2:over?'#f0546a55':'#f5a62355',title:over?`${cat} budget exceeded!`:`${cat} at ${Math.round(sp/limit*100)}%`,text:`${fmt(sp,currency)} spent of ${fmt(limit,currency)} budget.`};
    });
    r.push(...budgetAlerts.slice(0,2));

    // Top spending day
    const dayTotals={};thisMonth.filter(t=>t.type==='expense').forEach(t=>{dayTotals[t.date]=(dayTotals[t.date]||0)+t.amount;});
    const topDay=Object.entries(dayTotals).sort((a,b)=>b[1]-a[1])[0];
    if(topDay&&topDay[1]>100)r.push({icon:'📅',color:'var(--violet)',bc:'#b06ef722',bc2:'#b06ef755',title:`Big spending day: ${new Date(topDay[0]).toLocaleDateString('en',{month:'short',day:'numeric'})}`,text:`${fmt(topDay[1],currency)} spent in a single day.`});

    return r.slice(0,5);
  },[txs,mInc,mExp,cats,budgets,currency]);

  if(insights.length===0)return h('div',{className:'card'},h('div',{style:{textAlign:'center',padding:'12px 0',color:'var(--sub)',fontSize:12}},'🌟 No alerts — finances look healthy this month!'));
  return h('div',null,
    insights.map((ins,i)=>h('div',{key:i,className:'insight-auto',style:{background:ins.bc,borderColor:ins.bc2}},
      h('div',{className:'insight-auto-icon'},ins.icon),
      h('div',{className:'insight-auto-body'},h('div',{className:'insight-auto-title',style:{color:ins.color}},ins.title),h('div',{className:'insight-auto-text'},ins.text))
    ))
  );
}

/* ════════════════════════════

function ReceiptScanner({accounts,cats,currency,onSave,onClose}){
  const[scanning,setScanning]=useState(false);const[result,setResult]=useState(null);const[imgData,setImgData]=useState(null);const[err,setErr]=useState('');
  const[form,setForm]=useState({amount:'',note:'',categoryId:'c_food',accountId:accounts[0]?.id||'',date:today()});
  const fileRef=useRef();

  const handlePhoto=async e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=async ev=>{
      const b64=ev.target.result.split(',')[1];const mime=f.type;
      setImgData(ev.target.result);setScanning(true);setErr('');
      try{
        const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:'Extract from this receipt: merchant name, total amount (number only), and best category from: Food, Transport, Shopping, Entertainment, Health, Utilities, Education, Travel, Subscriptions, Other. Respond ONLY as JSON: {"merchant":"...","amount":0.00,"category":"..."}'}]}]})});
        const data=await res.json();
        const text=data.content?.[0]?.text||'{}';
        const clean=text.replace(/```json|```/g,'').trim();
        const parsed=JSON.parse(clean);
        const catMap={'Food':'c_food','Transport':'c_transport','Shopping':'c_shopping','Entertainment':'c_entertainment','Health':'c_health','Utilities':'c_utilities','Education':'c_education','Travel':'c_travel','Subscriptions':'c_subs','Other':'c_other'};
        setResult(parsed);
        setForm(p=>({...p,amount:String(parsed.amount||''),note:parsed.merchant||'',categoryId:catMap[parsed.category]||'c_other'}));
      }catch(e2){setErr('Could not read receipt. Try a clearer photo.');}
      setScanning(false);
    };r.readAsDataURL(f);
  };

  const submit=()=>{
    if(!form.amount||+form.amount<=0)return setErr('Enter amount.');
    const cat=cats.find(c=>c.id===form.categoryId)||cats[0];const acc=accounts.find(a=>a.id===form.accountId)||accounts[0];
    onSave([{id:genId(),type:'expense',categoryId:form.categoryId,category:cat.name,amount:+form.amount,note:form.note,date:form.date,accountId:acc.id,accountName:acc.name,currency,receipt:imgData}]);
    onClose();
  };

  return h('div',{className:'modal-bg',onClick:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'modal-sheet'},
      h('div',{className:'modal-handle'}),
      h('div',{className:'modal-title'},'📷 AI Receipt Scanner'),
      h('div',{style:{background:'linear-gradient(135deg,#1a2040,#0f1428)',border:'1px solid #4a90f544',borderRadius:12,padding:'10px 12px',marginBottom:12,display:'flex',alignItems:'center',gap:8}},
        h('div',{style:{fontSize:20}},'🤖'),h('div',{style:{fontSize:11,color:'#7090d0'}},'AI will extract merchant, amount & category automatically')
      ),
      imgData?h('img',{src:imgData,style:{width:'100%',maxHeight:140,objectFit:'cover',borderRadius:10,marginBottom:12}}):
        h('div',{className:`receipt-scan-area${scanning?' scanning':''}`,onClick:()=>fileRef.current?.click()},
          h('div',{style:{fontSize:32,marginBottom:6}},'📷'),
          h('div',{style:{fontSize:13,fontWeight:600,marginBottom:4}},scanning?'Scanning…':'Tap to scan receipt'),
          h('div',{style:{fontSize:11,color:'var(--sub)'}},scanning?'AI is reading your receipt…':'Take a photo or upload from gallery')
        ),
      h('input',{ref:fileRef,type:'file',accept:'image/*',capture:'environment',style:{display:'none'},onChange:handlePhoto}),
      result&&h('div',{style:{background:'#2ecc9a18',border:'1px solid #2ecc9a44',borderRadius:10,padding:'8px 12px',marginBottom:12,fontSize:12}},
        h('div',{style:{fontWeight:700,color:'var(--green)',marginBottom:2}},'✅ Receipt Scanned'),
        h('div',{style:{color:'var(--sub)'}},'Detected: '+result.merchant+' · $'+result.amount+' · '+result.category)
      ),
      err&&h('div',{className:'err'},err),
      h('div',{className:'field'},h('label',null,'Amount'),h('input',{className:'input',type:'number',value:form.amount,onChange:e=>setForm(p=>({...p,amount:e.target.value})),placeholder:'0.00'})),
      h('div',{className:'field'},h('label',null,'Merchant / Note'),h('input',{className:'input',type:'text',value:form.note,onChange:e=>setForm(p=>({...p,note:e.target.value})),placeholder:'Merchant name'})),
      h('div',{className:'field-row'},
        h('div',{className:'field'},h('label',null,'Category'),h('select',{className:'input',value:form.categoryId,onChange:e=>setForm(p=>({...p,categoryId:e.target.value}))},cats.filter(c=>c.type==='expense').map(c=>h('option',{key:c.id,value:c.id},c.icon+' '+c.name)))),
        h('div',{className:'field'},h('label',null,'Date'),h('input',{className:'input',type:'date',value:form.date,onChange:e=>setForm(p=>({...p,date:e.target.value}))}))

/* ════════════════════════════
   FEATURE 6: FINANCIAL HEALTH SCORE
════════════════════════════ */
function HealthScore({txs,accounts,budgets,cats,currency,mInc,mExp}){
  const score=useMemo(()=>{
    const factors=[];
    // 1. Savings Rate (0-25)
    if(mInc>0){const rate=(mInc-mExp)/mInc;const s=Math.min(25,Math.max(0,Math.round(rate*100)));factors.push({name:'Savings Rate',score:s,max:25,detail:Math.round(rate*100)+'% of income saved',color:rate>=0.2?'var(--green)':rate>=0.1?'var(--amber)':'var(--red)'});}
    else factors.push({name:'Savings Rate',score:0,max:25,detail:'No income recorded',color:'var(--dim)'});

    // 2. Budget Discipline (0-25)
    const now=new Date();const budgetCats=Object.entries(budgets).filter(([,v])=>v>0);
    if(budgetCats.length>0){
      const catMap={};txs.filter(t=>{const d=new Date(t.date);return t.type==='expense'&&d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();}).forEach(t=>{const c=cats.find(x=>x.id===t.categoryId);const n=c?.name||'Other';catMap[n]=(catMap[n]||0)+t.amount;});
      const within=budgetCats.filter(([cat,limit])=>(catMap[cat]||0)<=limit).length;
      const s=Math.round(within/budgetCats.length*25);
      factors.push({name:'Budget Discipline',score:s,max:25,detail:within+'/'+budgetCats.length+' categories on track',color:s>=20?'var(--green)':s>=12?'var(--amber)':'var(--red)'});
    }else factors.push({name:'Budget Discipline',score:12,max:25,detail:'No budgets set',color:'var(--sub)'});

    // 3. Debt Ratio (0-25)
    const totalAssets=accounts.filter(a=>a.type!=='Loan'&&a.type!=='Credit Card').reduce((s,a)=>s+a.balance,0);
    const totalDebt=accounts.filter(a=>a.type==='Loan'||a.type==='Credit Card').reduce((s,a)=>s+Math.abs(a.balance),0);
    const debtRatio=totalAssets>0?totalDebt/totalAssets:totalDebt>0?1:0;
    const ds=Math.max(0,Math.round((1-debtRatio)*25));
    factors.push({name:'Debt Ratio',score:Math.min(25,ds),max:25,detail:totalDebt>0?`${fmt(totalDebt,currency)} debt vs ${fmt(totalAssets,currency)} assets`:'No debt recorded',color:debtRatio<0.2?'var(--green)':debtRatio<0.5?'var(--amber)':'var(--red)'});

    // 4. Expense Stability (0-25)
    const months={};txs.filter(t=>t.type==='expense').forEach(t=>{const k=t.date.slice(0,7);months[k]=(months[k]||0)+t.amount;});
    const vals=Object.values(months);
    if(vals.length>=2){const avg=vals.reduce((s,v)=>s+v,0)/vals.length;const stdv=Math.sqrt(vals.reduce((s,v)=>s+(v-avg)**2,0)/vals.length);const cv=stdv/avg;const s=Math.max(0,Math.round((1-Math.min(1,cv))*25));factors.push({name:'Expense Stability',score:s,max:25,detail:'Month-to-month variation: '+(Math.round(cv*100))+'%',color:cv<0.2?'var(--green)':cv<0.4?'var(--amber)':'var(--red)'});}
    else factors.push({name:'Expense Stability',score:15,max:25,detail:'More data needed',color:'var(--sub)'});

    const total=factors.reduce((s,f)=>s+f.score,0);
    return{total,factors};
  },[txs,accounts,budgets,cats,mInc,mExp,currency]);

  const grade=score.total>=85?'A':score.total>=70?'B':score.total>=55?'C':score.total>=40?'D':'F';
  const gradeColor=score.total>=85?'var(--green)':score.total>=70?'var(--sky)':score.total>=55?'var(--amber)':score.total>=40?'var(--rose)':'var(--red)';
  const R=46,C=2*Math.PI*R;
  const pct=score.total/100;

  return h('div',null,
    h('div',{className:'card',style:{textAlign:'center'}},
      h('div',{className:'card-title'},'🏆 Financial Health Score'),
      h('div',{style:{display:'flex',justifyContent:'center',alignItems:'center',gap:20,marginBottom:16}},
        h('div',{className:'score-ring'},
          h('svg',{width:120,height:120,viewBox:'0 0 120 120'},
            h('circle',{cx:60,cy:60,r:R,fill:'none',stroke:'var(--muted)',strokeWidth:10}),
            h('circle',{cx:60,cy:60,r:R,fill:'none',stroke:gradeColor,strokeWidth:10,strokeLinecap:'round',strokeDasharray:C,strokeDashoffset:C*(1-pct),transform:'rotate(-90 60 60)',style:{transition:'stroke-dashoffset .8s ease'}})
          ),
          h('div',{style:{position:'absolute',textAlign:'center'}},
            h('div',{className:'score-number',style:{color:gradeColor}},score.total),
            h('div',{className:'score-label'},'/ 100')
          )
        ),
        h('div',{style:{textAlign:'left'}},
          h('div',{style:{fontSize:48,fontFamily:'Sora',fontWeight:800,color:gradeColor,lineHeight:1}},grade),
          h('div',{style:{fontSize:12,color:'var(--sub)',marginTop:2}},score.total>=85?'Excellent! 🌟':score.total>=70?'Good 👍':score.total>=55?'Fair ⚠️':'Needs Work 📉')
        )
      ),
      score.factors.map(f=>{
        const pct=f.score/f.max;
        return h('div',{key:f.name,className:'health-factor'},
          h('div',{className:'health-factor-label'},
            h('div',null,f.name),
            h('div',{style:{fontSize:10,color:'var(--sub)',marginTop:1}},f.detail)
          ),
          h('div',{style:{flex:1,minWidth:0}},h('div',{className:'progress-track'},h('div',{className:'progress-fill',style:{width:Math.round(pct*100)+'%',background:f.color}}))),
          h('div',{className:'health-factor-score',style:{color:f.color}},f.score+'/'+f.max)
        );
      })
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'💡 Improvement Tips'),
      score.total<85&&h('div',null,
        score.factors.filter(f=>f.score<f.max*0.8).map(f=>h('div',{key:f.name,style:{display:'flex',gap:8,marginBottom:8,fontSize:12}},
          h('span',null,'→'),h('div',null,h('span',{style:{fontWeight:700}},f.name+': '),f.name==='Savings Rate'?'Aim to save 20%+ of your income each month.':f.name==='Budget Discipline'?'Set and stick to category budgets.':f.name==='Debt Ratio'?'Work on reducing debts relative to assets.':'Keep monthly expenses more consistent.')
        ))
      )||h('div',{style:{fontSize:12,color:'var(--green)',textAlign:'center',padding:'8px 0'}},'🌟 You\'re doing great across all categories!')
    )
  );
}

/* ════════════════════════════
   FEATURE 7: BACKUP & RESTORE
════════════════════════════ */
function BackupRestore({txs,accounts,cats,budgets,goals,reminders,recurring,setTxs,setAccounts,setCats,setBudgets,setGoals,setReminders,setRecurring}){
  const[restoreMsg,setRestoreMsg]=useState('');const fileRef=useRef();

  const getAllData=()=>({version:'5.0',exportedAt:new Date().toISOString(),txs,accounts,cats,budgets,goals,reminders,recurring});

  const exportJSON=()=>{
    const data=getAllData();const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`epocket-backup-${today()}.json`;a.click();
  };

  const exportCSV=()=>{
    const rows=txs.map(t=>`${t.date},${t.type},${t.category||''},"${t.note||''}",${t.amount},${t.currency||'USD'},"${t.accountName||''}"`).join('\n');
    const b=new Blob(['Date,Type,Category,Note,Amount,Currency,Account\n'+rows],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`epocket-transactions-${today()}.csv`;a.click();
  };

  const importJSON=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.txs)setTxs(data.txs);
        if(data.accounts)setAccounts(data.accounts);
        if(data.cats)setCats(data.cats);
        if(data.budgets)setBudgets(data.budgets);
        if(data.goals)setGoals(data.goals);
        if(data.reminders)setReminders(data.reminders);
        if(data.recurring)setRecurring(data.recurring);
        setRestoreMsg('✅ Backup restored successfully! '+new Date(data.exportedAt).toLocaleDateString());
      }catch{setRestoreMsg('❌ Invalid backup file.');}
    };r.readAsText(f);
  };

  const importCSV=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      try{
        const lines=ev.target.result.split('\n').slice(1).filter(Boolean);
        const imported=lines.map(line=>{
          const parts=line.match(/(".*?"|[^,]+)(?=,|$)/g)||[];
          const clean=parts.map(p=>p.replace(/^"|"$/g,''));
          return{id:genId(),date:clean[0]||today(),type:clean[1]||'expense',category:clean[2]||'Other',categoryId:'c_other',note:clean[3]||'',amount:parseFloat(clean[4])||0,currency:clean[5]||'USD',accountName:clean[6]||'',accountId:''};
        }).filter(t=>t.amount>0);
        setTxs(p=>[...imported,...p]);
        setRestoreMsg(`✅ Imported ${imported.length} transactions from CSV.`);
      }catch{setRestoreMsg('❌ Could not parse CSV file.');}
    };r.readAsText(f);
  };

  const shareViaLink=()=>{
    const data=getAllData();const json=JSON.stringify(data);
    try{navigator.share({title:'ePocket Backup',text:'ePocket data backup',files:[new File([json],'epocket-backup.json',{type:'application/json'})]}).catch(()=>{});}
    catch{alert('Share not supported. Use Export JSON instead.');}
  };

  return h('div',null,
    restoreMsg&&h('div',{style:{background:restoreMsg.startsWith('✅')?'#2ecc9a18':'#f0546a18',border:`1px solid ${restoreMsg.startsWith('✅')?'#2ecc9a44':'#f0546a44'}`,borderRadius:10,padding:'10px 12px',marginBottom:12,fontSize:12,fontWeight:600,color:restoreMsg.startsWith('✅')?'var(--green)':'var(--red)'}},restoreMsg),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'💾 Export & Backup'),
      h('button',{className:'backup-btn',onClick:exportJSON},
        h('div',{className:'backup-btn-icon',style:{background:'#4a90f522',border:'1px solid #4a90f544'}},'📦'),
        h('div',{className:'backup-btn-text'},h('div',{className:'backup-btn-name'},'Export Full Backup (JSON)'),h('div',{className:'backup-btn-sub'},'All data: transactions, accounts, budgets, goals')),
        h('div',{style:{color:'var(--blue)',fontSize:18}},'↓')
      ),
      h('button',{className:'backup-btn',onClick:exportCSV},
        h('div',{className:'backup-btn-icon',style:{background:'#2ecc9a22',border:'1px solid #2ecc9a44'}},'📄'),
        h('div',{className:'backup-btn-text'},h('div',{className:'backup-btn-name'},'Export Transactions (CSV)'),h('div',{className:'backup-btn-sub'},'Compatible with Excel, Google Sheets, banks')),
        h('div',{style:{color:'var(--green)',fontSize:18}},'↓')
      ),
      typeof navigator.share!=='undefined'&&h('button',{className:'backup-btn',onClick:shareViaLink},
        h('div',{className:'backup-btn-icon',style:{background:'#b06ef722',border:'1px solid #b06ef744'}},'📤'),
        h('div',{className:'backup-btn-text'},h('div',{className:'backup-btn-name'},'Share Backup'),h('div',{className:'backup-btn-sub'},'Send to iCloud, Google Drive, or any app')),
        h('div',{style:{color:'var(--violet)',fontSize:18}},'↗')
      )
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'📂 Restore & Import'),
      h('div',{className:'import-zone',onClick:()=>document.getElementById('import-json-input').click()},
        h('div',{style:{fontSize:28,marginBottom:6}},'📦'),
        h('div',{style:{fontSize:13,fontWeight:700,marginBottom:2}},'Restore from Backup'),
        h('div',{style:{fontSize:11,color:'var(--sub)'}},'Upload a .json backup file from ePocket')
      ),
      h('input',{id:'import-json-input',type:'file',accept:'.json',style:{display:'none'},onChange:importJSON}),
      h('div',{style:{marginTop:12,marginBottom:4,fontSize:10,fontWeight:700,color:'var(--sub)',letterSpacing:'.06em',textTransform:'uppercase'}},'Or Import Bank CSV'),
      h('div',{className:'import-zone',style:{borderColor:'#2ecc9a66'},onClick:()=>document.getElementById('import-csv-input').click()},
        h('div',{style:{fontSize:28,marginBottom:6}},'🏦'),
        h('div',{style:{fontSize:13,fontWeight:700,marginBottom:2}},'Import Bank CSV'),
        h('div',{style:{fontSize:11,color:'var(--sub)'}},'Standard format: Date, Type, Category, Note, Amount')
      ),
      h('input',{id:'import-csv-input',type:'file',accept:'.csv',style:{display:'none'},onChange:importCSV})
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'ℹ️ Data Summary'),
      h('div',{style:{fontSize:12,color:'var(--sub)',lineHeight:2}},
        h('div',null,`📋 ${txs.length} transactions`),
        h('div',null,`🏦 ${accounts.length} accounts`),
        h('div',null,`🎯 ${goals.length} goals · ${(reminders||[]).length} bill reminders`),
        h('div',null,`🔁 ${(recurring||[]).length} recurring transactions`)
      )
    )
  );
}

/* ════════════════════════════
              ROOT APP
════════════════════════════ */
function App(){
  const[profile,setProfile]=usePersist('mp_profile_v4',null);
  const[spaces,setSpaces]=usePersist('mp_spaces_v4',[]);
  const[activeSpaceId,setActiveSpaceId]=usePersist('mp_active_space',null);
  const[showSwitcher,setShowSwitcher]=useState(false);
  const fbReady=useFirebase();

  // Sync spaces from Firestore when profile is ready
  useEffect(()=>{
    if(!fbReady||!profile)return;
    const{collection:col,onSnapshot:ons,query:q,where:w}=window.__fb;
    // Listen to all spaces where user is a member
    // Firestore can't query nested map keys directly, so we listen broadly and filter
    // For simplicity, we use local spaces list + re-fetch on load
    spaces.forEach(sp=>{
      window.__fb.getDoc(window.__fb.doc(window.__db,'spaces',sp.id)).then(d=>{
        if(d.exists())setSpaces(prev=>prev.map(s=>s.id===sp.id?{id:d.id,...d.data()}:s));
      }).catch(()=>{});
    });
  },[fbReady,profile?.id]);

  const createSpace=sp=>setSpaces(p=>[...p,sp]);
  const joinSpace=sp=>setSpaces(p=>p.find(s=>s.id===sp.id)?p.map(s=>s.id===sp.id?sp:s):[...p,sp]);

  if(!profile)return h(ProfileSetup,{onSave:p=>{setProfile(p);}});

  const activeSpace=spaces.find(s=>s.id===activeSpaceId)||null;
  const cats=LS.get('mp_cats_v3',DEFAULT_CATS);
  const currency=LS.get('mp_currency','USD');

  return h('div',{style:{height:'100%',display:'flex',flexDirection:'column'}},
    // Space mode topbar
    activeSpace&&h('div',{className:'topbar'},
      h('div',{className:'topbar-logo',style:{cursor:'pointer'},onClick:()=>setShowSwitcher(true)},
        h('div',{className:'topbar-icon',style:{background:`linear-gradient(135deg,${activeSpace.color},${activeSpace.color}88)`}},activeSpace.emoji),
        h('div',null,h('div',{className:'topbar-title'},activeSpace.name),h('div',{className:'topbar-sub'},'Shared Space'))
      ),
      h('div',{className:'topbar-actions'},
        h('button',{className:'topbar-btn ghost',onClick:()=>{setActiveSpaceId(null);}},h('span',{style:{fontSize:12}},'👛'))
      )
    ),
    // Space content
    activeSpace
      ?h('div',{className:'page'},h(SpaceHome,{space:activeSpace,myProfile:profile,cats,currency}))
      :h(PersonalApp,{myProfile:profile,spaces,onOpenSpaces:()=>setShowSwitcher(true)}),
    // Bottom nav only in personal mode
    !activeSpace&&null,
    // Space switcher modal
    showSwitcher&&h(SpaceSwitcherModal,{spaces,activeSpaceId,myProfile:profile,onSwitch:id=>{setActiveSpaceId(id);setShowSwitcher(false);},onClose:()=>setShowSwitcher(false),onCreateSpace:createSpace,onJoinSpace:joinSpace})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
